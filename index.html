<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏮簡單學成語✨</title>
    <style>
        /* 全局與背景設定 */
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100%; overflow-x: hidden; background-color: #f4f4f4;}
        
        .bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-image: url('https://i.ibb.co/YT82HPYv/Gemini-Generated-Image-wkgvbwwkgvbwwkgv.png');
            background-size: cover; background-position: center; filter: brightness(0.9);
        }

        /* 首頁標題 (標楷體、黑黃配色) */
        .main-title {
            font-family: 'BiauKai', '標楷體', 'DFKai-SB', serif;
            font-size: 4.5rem; font-weight: bold; color: #f1c40f; text-align: center; margin-bottom: 20px;
            text-shadow: 
                -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000,
                4px 4px 0 #000, 6px 6px 15px rgba(0,0,0,0.6);
            letter-spacing: 4px; z-index: 10;
        }

        /* 登入介面 */
        #login-screen { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .login-box { background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 350px; border-top: 8px solid #f1c40f;}
        .login-box input { padding: 12px; font-size: 1.2rem; border: 2px solid #bdc3c7; border-radius: 8px; margin-bottom: 20px; width: 80%; text-align: center;}
        .login-box button { background: #3498db; color: white; border: none; padding: 12px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; width: 85%; font-weight: bold; margin-bottom: 10px; transition: 0.2s;}
        .login-box button:hover { background: #2980b9; transform: translateY(-2px);}
        .leaderboard-btn { background: #e67e22 !important; }
        .leaderboard-btn:hover { background: #d35400 !important; }

        /* 音樂控制按鈕 (明顯標誌) */
        .music-btn { 
            position: fixed; top: 20px; right: 20px; font-size: 2.2rem; cursor: pointer; z-index: 100; 
            background: #fff; border-radius: 50%; width: 65px; height: 65px; display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 4px solid #bdc3c7; transition: all 0.3s;
        }
        .music-btn.playing {
            border-color: #f1c40f; color: #e74c3c;
            animation: pulse-ring 2s infinite, spin-slow 8s linear infinite;
        }
        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(241, 196, 15, 0); } 100% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0); } }
        @keyframes spin-slow { 100% { transform: rotate(360deg); } }

        /* 右下角設定(後台)按鈕 */
        .settings-btn {
            position: fixed; bottom: 20px; right: 20px; font-size: 2rem; cursor: pointer; z-index: 100;
            background: rgba(255,255,255,0.8); border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s;
        }
        .settings-btn:hover { background: #fff; transform: rotate(90deg); }

        /* 內容容器 */
        #main-app { display: none; min-height: 100vh; padding: 20px; box-sizing: border-box; background: rgba(255, 255, 255, 0.7); }
        .section { display: none; max-width: 900px; margin: 0 auto; background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .section.active { display: block; }

        /* 主目錄按鈕 */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .idiom-card-btn { background: #34495e; color: #f1c40f; padding: 20px; text-align: center; border-radius: 10px; cursor: pointer; font-size: 1.8rem; font-family: '標楷體', serif; font-weight: bold; transition: transform 0.2s, background 0.3s; border: 2px solid #2c3e50;}
        .idiom-card-btn:hover { transform: translateY(-5px); background: #2c3e50; color: #fff;}

        /* 圖片故事詞典 */
        .idiom-detail-header { text-align: center; margin-bottom: 30px; border-bottom: 2px dashed #bdc3c7; padding-bottom: 20px;}
        .idiom-detail-header img { display: block; margin: 0 auto 20px auto; border-radius: 10px; max-width: 80%; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .data-row { display: flex; padding: 12px 0; border-bottom: 1px solid #eee; text-align: left;}
        .data-label { width: 100px; font-weight: bold; color: #fff; background: #8e44ad; text-align: center; padding: 6px; border-radius: 5px; margin-right: 15px; flex-shrink: 0;}
        .data-content { flex: 1; align-self: center; font-size: 1.15rem; color: #333;}

        /* 情境測驗區塊 */
        .quiz-area { background: #ecf0f1; padding: 25px; border-radius: 10px; margin-top: 30px; border-left: 8px solid #27ae60;}
        .quiz-status { font-weight: bold; color: #7f8c8d; margin-bottom: 15px; font-size: 1.1rem; display: flex; justify-content: space-between;}
        .quiz-question { margin-bottom: 20px; font-size: 1.25rem; font-weight: bold; color: #2c3e50; line-height: 1.6;}
        .quiz-options button { display: block; width: 100%; text-align: left; padding: 12px; margin: 8px 0; font-size: 1.1rem; border: 2px solid #bdc3c7; background: #fff; border-radius: 8px; cursor: pointer; transition: 0.2s;}
        .quiz-options button:hover { background: #d6eaf8; border-color: #3498db; }
        .quiz-feedback { margin-top: 15px; font-size: 1.1rem; font-weight: bold; display: none; padding: 15px; border-radius: 8px;}
        .feedback-error { background: #fadbd8; color: #c0392b; border: 1px solid #e74c3c; }
        
        .back-btn { background: #95a5a6; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1rem; margin-bottom: 20px;}

        /* 模態框 (Modal) - 排行榜 & 語料庫 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;}
        .modal-content { background: #fff; padding: 30px; border-radius: 15px; width: 100%; max-width: 700px; max-height: 85vh; overflow-y: auto; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 2rem; cursor: pointer; color: #7f8c8d; }
        .close-modal:hover { color: #e74c3c; }
        
        /* 語料庫列表樣式 */
        .corpus-list { list-style: none; padding: 0; }
        .corpus-list li { background: #f8f9fa; padding: 15px; margin-bottom: 10px; border-left: 5px solid #3498db; border-radius: 4px; font-size: 1.1rem; line-height: 1.5; color: #2c3e50;}
        .corpus-highlight { color: #e74c3c; font-weight: bold; font-size: 1.2rem; }

        /* 表格 */
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .admin-table th, .admin-table td { border: 1px solid #bdc3c7; padding: 12px; text-align: center; }
        .admin-table th { background: #34495e; color: white; }
    </style>
</head>
<body>

    <div class="bg-layer"></div>

    <audio id="bgm" loop preload="auto">
        <source src="https://otologic.jp/sounds/bgm/pre/kuuhaku%20to%20seizyaku.mp3" type="audio/mpeg">
    </audio>

    <div id="bgm-btn" class="music-btn" onclick="toggleBGM()" title="開啟/關閉音樂">🎵</div>

    <div class="settings-btn" onclick="showAdminLogin()" title="系統後台">⚙️</div>

    <div id="login-screen">
        <div class="main-title">🏮簡單學成語✨</div>
        <div class="login-box">
            <h3 style="color:#2c3e50; margin-top:0;">歡迎進入成語世界</h3>
            <input type="text" id="username" placeholder="請輸入您的姓名..." autocomplete="off">
            <button onclick="startGame()">▶ 開始學習</button>
            <button class="leaderboard-btn" onclick="openLeaderboard()">🏆 學習排名榜</button>
        </div>
    </div>

    <div id="main-app">
        <div id="dashboard" class="section active">
            <div class="main-title" style="font-size: 3.5rem;">🏮簡單學成語✨</div>
            <h2 style="text-align:center; color:#2c3e50; margin-bottom: 30px;">「有X無Y」成語匯集</h2>
            <div class="dashboard-grid" id="dashboard-grid">
                </div>
            
            <div style="margin-top: 50px; padding: 25px; background: #e8f8f5; border-radius: 15px; border: 2px solid #1abc9c; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                <h3 style="margin-top:0; color:#16a085;">🔍 語法分析器 (詞性判斷)</h3>
                <input type="text" id="syntax-input" placeholder="請輸入包含目標成語的句子..." style="width:75%; padding:12px; font-size:1.1rem; border-radius:5px; border:1px solid #ccc;">
                <button onclick="analyzeSyntax()" style="padding:12px 25px; font-size:1.1rem; background:#1abc9c; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">分析</button>
                <div id="query-result" style="margin-top:15px; font-weight:bold; color:#2c3e50; font-size:1.2rem; line-height: 1.6;"></div>
                <div id="corpus-btn-container" style="margin-top: 15px; display:none;">
                    <button onclick="openCorpusModal()" style="background:#8e44ad; color:white; padding:10px 20px; border:none; border-radius:5px; cursor:pointer; font-size:1.1rem;">📚 查看語料庫真實範例</button>
                </div>
            </div>
        </div>

        <div id="idiom-detail" class="section">
            <button class="back-btn" onclick="switchTab('dashboard')">⬅ 返回主目錄</button>
            
            <div class="idiom-detail-header" id="detail-header">
                </div>

            <div class="quiz-area">
                <h2>📝 情境實戰演練 (共 10 題)</h2>
                <div id="quiz-container">
                    <p style="font-size:1.1rem; color:#34495e;">系統將從情境題庫中隨機抽取 10 題。<br>⚠️ **計分規則**：每題有 3 次作答機會。答對得 10 分，錯 3 次該題 0 分並顯示詳解。</p>
                    <button onclick="startQuiz()" style="padding:12px 30px; font-size:1.2rem; background:#27ae60; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">開始測驗</button>
                </div>
            </div>
        </div>

        <div id="admin-panel" class="section">
            <h2>⚙️ 學習者數據後台</h2>
            <button class="back-btn" onclick="switchTab('dashboard')">返回主目錄</button>
            <button onclick="clearData()" style="background: red; color: white; padding:10px; border:none; border-radius:5px; cursor:pointer; float:right;">清除所有資料</button>
            <table class="admin-table">
                <thead>
                    <tr><th>學習者名稱</th><th>總分數</th><th>最擅長成語 (答對次數)</th><th>最弱成語 (答錯次數)</th></tr>
                </thead>
                <tbody id="admin-table-body"></tbody>
            </table>
        </div>
    </div>

    <div id="leaderboard-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('leaderboard-modal')">&times;</span>
            <h2 style="text-align:center; color:#e67e22;">🏆 學習排名榜</h2>
            <table class="admin-table">
                <thead>
                    <tr><th>排名</th><th>學習者</th><th>累計總分</th></tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>
    </div>

    <div id="corpus-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('corpus-modal')">&times;</span>
            <h2 style="color:#8e44ad; margin-top:0;" id="corpus-title">語料庫真實範例</h2>
            <p style="color:#7f8c8d; margin-bottom:20px;">以下例句皆萃取自新聞、文學作品與語料庫真實文本：</p>
            <ul class="corpus-list" id="corpus-list-container"></ul>
        </div>
    </div>

    <script>
        // --- 核心資料區 ---
        let currentUser = "";
        let bgmPlaying = false;
        let currentQueriedIdiom = "";

        const idiomsData = {
            "有備無患": { zhuyin: "ㄧㄡˇ ㄅㄟˋ ㄨˊ ㄏㄨㄢˋ", pinyin: "yǒu bèi wú huàn", literal: "只要有準備，就不會有後患。", meta: "比喻事先做好準備，就能避免災禍。", img: "https://i.ibb.co/kVyRBfWJ/image.png" },
            "有恃無恐": { zhuyin: "ㄧㄡˇ ㄕˋ ㄨˊ ㄎㄨㄥˇ", pinyin: "yǒu shì wú kǒng", literal: "有依靠而沒有恐懼。", meta: "形容有依靠而無所顧忌。", img: "https://i.ibb.co/rKNPVsN9/image.png" },
            "有教無類": { zhuyin: "ㄧㄡˇ ㄐㄧㄠˋ ㄨˊ ㄌㄟˋ", pinyin: "yǒu jiào wú lèi", literal: "教育不分對象的類別。", meta: "指施教的對象沒有貧富、貴賤、智愚、善惡之分。", img: "https://i.ibb.co/qFWVFTLp/image.png" },
            "有氣無力": { zhuyin: "ㄧㄡˇ ㄑㄧˋ ㄨˊ ㄌㄧˋ", pinyin: "yǒu qì wú lì", literal: "有呼吸但沒有力氣。", meta: "形容精神不振，虛弱無力的樣子。", img: "https://i.ibb.co/TxCKwgR4/image.png" },
            "有意無意": { zhuyin: "ㄧㄡˇ ㄧˋ ㄨˊ ㄧˋ", pinyin: "yǒu yì wú yì", literal: "又像是有意，又像是無意。", meta: "形容不是特意，或存心不讓人明顯看出來的樣子。", img: "https://i.ibb.co/N61GDv9f/image.png" },
            "有眼無珠": { zhuyin: "ㄧㄡˇ ㄧㄢˇ ㄨˊ ㄓㄨ", pinyin: "yǒu yǎn wú zhū", literal: "長了眼睛卻沒有眼珠。", meta: "比喻沒有眼力，看不出人或事物的價值。", img: "https://i.ibb.co/BKZhjrVJ/image.png" }
        };

        // --- 語料庫資料 (從 .txt 檔案中萃取的真實文本) ---
        const miniCorpus = {
            "有備無患": [
                "從事這份工作，也許終其一生不會遇到自殺當事人，但有備無患，多一分準備也是好的。",
                "病情嚴重的那一天，柏楊夫人為了有備無患，就翻箱倒櫃找出了一萬元。",
                "為你的將來做準備。提早練習，有備無患，不是嗎？",
                "他截圖給我們看，「有備無患，某寶上的武亦姝同款。」",
                "平時儲備好防災物資，遇到突發狀況時才能有備無患。",
                "國防建設的目的在於有備無患，以維護國家長治久安。"
            ],
            "有恃無恐": [

                "孩子在學校受罰，父母親又替他開罪，孩子就有恃無恐，變本加厲，強化了他的非行特質。",
                "「被偏愛的都有恃無恐」，卻成為很多人的情感座右銘。",
                "他因為背後有強大的財團撐腰，所以在談判桌上總是顯得有恃無恐。",
                "歹徒自以為握有人質，有恃無恐地向警方提出各種無理的要求。"
            ],
            "有教無類": [
                "沒有預設立場的教師，才能發揮有教無類的精神。學業成績不好，不應該被放棄。",
                "循循善誘；胸懷愛護之心，才能做到有教無類。教師一旦具備這些特質，自然能提供好教育。",
                "五十七年的國民義務教育實施到現在，為求有教無類，只有強迫入學，卻沒有適性發展。",

            "有氣無力": [
                "他連續高燒了三天，整個人顯得有氣無力的。",

                "手術過後，病人躺在病床上，有氣無力地向家屬點了點頭。",

        // --- 情境式題庫設計 (每成語示範 10~15 題，系統隨機抽 10 題) ---
        const questionBank = {
            "有備無患": [
                { q: "最近颱風頻繁，林伯伯在周末特地去超市買了幾箱礦泉水、泡麵和手電筒電池放在儲藏室。鄰居笑他太緊張，林伯伯笑著回答：「遇到天災，總是____嘛！」", options: ["有恃無恐", "有意無意", "有備無患", "有眼無珠"], ans: "有備無患", exp: "林伯伯事前準備物資以防萬一，符合「有備無患」的意思。" },

                { q: "出版社編輯退回了J.K.羅琳《哈利波特》的第一集原稿，認為這種關於魔法的童書沒有市場，根本賣不出去。如果那位編輯現在回想起來，一定覺得自己當時真是____到了極點。", options: ["有教無類", "有意無意", "有眼無珠", "有氣無力"], ans: "有眼無珠", exp: "缺乏眼光，錯失了出版世界級暢銷書的機會。" },
                { q: "「你放著家裡這麼賢慧、幫你照顧中風母親的妻子不要，跑去外面找一個只會花你錢的年輕小三，你真的是____，遲早有你後悔的一天！」岳父氣得指著女婿的鼻子大罵。", options: ["有眼無珠", "有恃無恐", "有備無患", "有教無類"], ans: "有眼無珠", exp: "不知珍惜眼前真正對自己好的人。" }

        // --- 介面控制與音樂邏輯 ---
        function startGame() {
            const nameInput = document.getElementById('username').value.trim();
            if(!nameInput) { alert("請先輸入您的姓名！"); return; }
            currentUser = nameInput;
            
            // 點擊按鈕時確保音樂播放 (解決瀏覽器限制)
            const audio = document.getElementById('bgm');
            audio.volume = 0.5;
            let playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => {
                    bgmPlaying = true;
                    document.getElementById('bgm-btn').classList.add('playing');
                }).catch(e => console.log("音樂播放需稍後手動開啟"));
            }

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            
            initUserStats();
            renderDashboard();
        }

        // 自動嘗試播放音樂 (若被阻擋，標誌仍會顯示讓使用者點擊)
        window.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('bgm');
            audio.volume = 0.5;
            audio.play().then(() => {
                bgmPlaying = true;
                document.getElementById('bgm-btn').classList.add('playing');
            }).catch(e => { console.log("等待互動以播放音樂"); });
        });

        function toggleBGM() {
            const audio = document.getElementById('bgm');
            const btn = document.getElementById('bgm-btn');
            if(bgmPlaying) { 
                audio.pause(); 
                btn.classList.remove('playing');
            } else { 
                audio.play(); 
                btn.classList.add('playing');
            }
            bgmPlaying = !bgmPlaying;
        }

        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            window.scrollTo(0,0);
        }

        // --- Modal 控制 ---
        function openLeaderboard() {
            let db = JSON.parse(localStorage.getItem('idiomAppDB')) || {};
            let usersArray = [];
            for(let user in db) { usersArray.push({name: user, score: db[user].score}); }
            usersArray.sort((a, b) => b.score - a.score); // 由高到低排序

            let tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = "";
            if(usersArray.length === 0) {
                tbody.innerHTML = "<tr><td colspan='3'>目前還沒有排名紀錄喔！</td></tr>";
            } else {
                usersArray.forEach((u, idx) => {
                    let medal = idx === 0 ? "🥇" : (idx === 1 ? "🥈" : (idx === 2 ? "🥉" : idx + 1));
                    tbody.innerHTML += `<tr><td>${medal}</td><td style="font-weight:bold;">${u.name}</td><td>${u.score} 分</td></tr>`;
                });
            }
            document.getElementById('leaderboard-modal').style.display = "flex";
        }

        function openCorpusModal() {
            if(!currentQueriedIdiom || !miniCorpus[currentQueriedIdiom]) return;
            
            document.getElementById('corpus-title').innerText = `【${currentQueriedIdiom}】語料庫真實範例`;
            let listHTML = "";
            miniCorpus[currentQueriedIdiom].forEach(sentence => {
                // 將成語高亮顯示
                let highlighted = sentence.replace(new RegExp(currentQueriedIdiom, 'g'), `<span class="corpus-highlight">${currentQueriedIdiom}</span>`);
                listHTML += `<li>${highlighted}</li>`;
            });
            document.getElementById('corpus-list-container').innerHTML = listHTML;
            document.getElementById('corpus-modal').style.display = "flex";
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = "none";
        }

        function renderDashboard() {
            const grid = document.getElementById('dashboard-grid');
            grid.innerHTML = "";
            let counter = 1;
            for(let key in idiomsData) {
                grid.innerHTML += `<div class="idiom-card-btn" onclick="openIdiom('${key}')">${counter}. ${key}</div>`;
                counter++;
            }
        }

        // --- 測驗系統狀態 ---
        let currentActiveIdiom = "";
        let currentQuizList = [];
        let currentQIdx = 0;
        let currentQAttempts = 0;
        let sessionScore = 0;

        function openIdiom(idiomName) {
            currentActiveIdiom = idiomName;
            const data = idiomsData[idiomName];
            
            document.getElementById('detail-header').innerHTML = `
                <img src="${data.img}" alt="${idiomName}">
                <div style="max-width: 600px; margin: 0 auto;">
                    <div class="data-row"><div class="data-label">成 語</div><div class="data-content" style="font-weight:bold; font-size:1.8rem; color:#8e44ad;">${idiomName}</div></div>
                    <div class="data-row"><div class="data-label">注 音</div><div class="data-content">${data.zhuyin}</div></div>
                    <div class="data-row"><div class="data-label">漢語拼音</div><div class="data-content">${data.pinyin}</div></div>
                    <div class="data-row"><div class="data-label">字 面 義</div><div class="data-content">${data.literal}</div></div>
                    <div class="data-row"><div class="data-label">隱 喻 義</div><div class="data-content">${data.meta}</div></div>
                </div>
            `;
            
            document.getElementById('quiz-container').innerHTML = `
                <p style="font-size:1.1rem; color:#34495e; background:#fff; padding:15px; border-radius:8px;">系統將從情境題庫中隨機抽取 10 題。<br>⚠️ **計分規則**：每題有 3 次作答機會。答對得 10 分，錯 3 次該題 0 分並顯示詳解。</p>
                <button onclick="startQuiz()" style="padding:12px 30px; font-size:1.2rem; background:#27ae60; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; margin-top:10px;">▶ 開始測驗</button>
            `;
            
            switchTab('idiom-detail');
        }

        function startQuiz() {
            // 從題庫隨機抽 10 題
            let pool = [...questionBank[currentActiveIdiom]];
            let shuffled = pool.sort(() => 0.5 - Math.random());
            currentQuizList = shuffled.slice(0, 10);
            currentQIdx = 0;
            sessionScore = 0;
            
            showQuestion();
        }

        function showQuestion() {
            if(currentQIdx >= currentQuizList.length) { endQuiz(); return; }
            currentQAttempts = 0;
            const qData = currentQuizList[currentQIdx];
            
            // 隨機打亂選項順序
            let opts = [...qData.options].sort(() => 0.5 - Math.random());
            let optionsHtml = "";
            opts.forEach(opt => {
                optionsHtml += `<button onclick="checkAnswer('${opt}', this)">${opt}</button>`;
            });

            document.getElementById('quiz-container').innerHTML = `
                <div class="quiz-status">
                    <span>📝 題目： ${currentQIdx + 1} / 10</span>
                    <span style="color:#e67e22;">⭐ 目前得分：${sessionScore} 分</span>
                </div>
                <div class="quiz-question">${qData.q}</div>
                <div class="quiz-options" id="options-box">${optionsHtml}</div>
                <div id="q-feedback" class="quiz-feedback"></div>
                <button id="next-btn" onclick="nextQuestion()" style="display:none; margin-top:20px; padding:12px 25px; background:#3498db; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold; width:100%;">下一題 ➡</button>
            `;
        }

        function checkAnswer(selected, btnElement) {
            const qData = currentQuizList[currentQIdx];
            const feedbackBox = document.getElementById('q-feedback');
            
            if(selected === qData.ans) {
                // 答對
                btnElement.style.background = "#2ecc71"; btnElement.style.color = "white";
                feedbackBox.className = "quiz-feedback";
                feedbackBox.style.background = "#d5f5e3"; feedbackBox.style.color = "#27ae60";
                feedbackBox.innerHTML = `✅ 答對了！得 10 分。<br><span style="font-size:1rem; font-weight:normal; display:block; margin-top:8px;">💡 解析：${qData.exp}</span>`;
                feedbackBox.style.display = "block";
                sessionScore += 10;
                recordStat(currentActiveIdiom, true);
                lockOptions();
            } else {
                // 答錯
                currentQAttempts++;
                btnElement.style.background = "#e74c3c"; btnElement.style.color = "white";
                btnElement.disabled = true;
                
                if(currentQAttempts >= 3) {
                    // 錯3次
                    feedbackBox.className = "quiz-feedback feedback-error";
                    feedbackBox.innerHTML = `❌ 錯誤已達 3 次！本題 0 分。<br>正確答案是：<strong>${qData.ans}</strong><br><span style="font-size:1rem; font-weight:normal; display:block; margin-top:8px;">💡 解析：${qData.exp}</span>`;
                    feedbackBox.style.display = "block";
                    recordStat(currentActiveIdiom, false);
                    lockOptions();
                } else {
                    feedbackBox.className = "quiz-feedback feedback-error";
                    feedbackBox.innerHTML = `❌ 答錯了！還剩 ${3 - currentQAttempts} 次機會。`;
                    feedbackBox.style.display = "block";
                }
            }
        }

        function lockOptions() {
            const btns = document.getElementById('options-box').querySelectorAll('button');
            btns.forEach(b => b.disabled = true);
            document.getElementById('next-btn').style.display = "block";
        }

        function nextQuestion() {
            currentQIdx++;
            showQuestion();
        }

        function endQuiz() {
            saveUserData();
            document.getElementById('quiz-container').innerHTML = `
                <h2 style="color:#2c3e50; text-align:center; font-size:2rem;">🎉 測驗結束！</h2>
                <div style="text-align:center; font-size:4rem; font-weight:bold; color:#e74c3c; margin:20px 0; text-shadow: 2px 2px 0px #fadbd8;">${sessionScore} 分</div>
                <div style="text-align:center;">
                    <button onclick="startQuiz()" style="padding:12px 25px; font-size:1.2rem; background:#3498db; color:white; border:none; border-radius:8px; cursor:pointer; margin:10px; font-weight:bold;">🔄 重新挑戰</button>
                    <button onclick="switchTab('dashboard')" style="padding:12px 25px; font-size:1.2rem; background:#95a5a6; color:white; border:none; border-radius:8px; cursor:pointer; margin:10px; font-weight:bold;">🏠 回主目錄</button>
                </div>
            `;
        }

        // --- 語法查詢器邏輯 (含語料庫按鈕觸發) ---
        function analyzeSyntax() {
            const text = document.getElementById('syntax-input').value;
            const resBox = document.getElementById('query-result');
            const corpusBtnBox = document.getElementById('corpus-btn-container');
            
            let foundIdiom = Object.keys(idiomsData).find(i => text.includes(i));
            
            if(!foundIdiom) { 
                resBox.innerHTML = "<span style='color:#e74c3c'>未偵測到指定的成語喔！請檢查句子。</span>"; 
                corpusBtnBox.style.display = "none";
                return; 
            }
            
            currentQueriedIdiom = foundIdiom; // 儲存當前查到的成語供語料庫模態框使用
            
            let role = "未知";
            if (text.includes(foundIdiom + "的")) role = "[定語] (修飾名詞)";
            else if (text.includes(foundIdiom + "地")) role = "[狀語] (修飾動詞)";
            else if (text.endsWith(foundIdiom) || text.endsWith(foundIdiom+"。") || text.includes("是" + foundIdiom)) role = "[謂語] 或 [賓語]";
            else if (text.includes("得" + foundIdiom)) role = "[補語] (補充狀態)";
            else if (text.startsWith(foundIdiom)) role = "[主語]";
            else role = "[謂語] (作核心動態描述)";

            resBox.innerHTML = `✅ 目標成語：<span style="color:#8e44ad; font-size:1.4rem;">${foundIdiom}</span><br>📌 語法角色推測：<span style="color:#d35400; font-size:1.4rem;">${role}</span>`;
            
            // 顯示語料庫按鈕
            corpusBtnBox.style.display = "block";
        }

        // --- 後台數據管理 ---
        function initUserStats() {
            let db = JSON.parse(localStorage.getItem('idiomAppDB')) || {};
            if(!db[currentUser]) {
                db[currentUser] = { score: 0, stats: {} };
                for(let key in idiomsData) db[currentUser].stats[key] = { correct: 0, wrong: 0 };
                localStorage.setItem('idiomAppDB', JSON.stringify(db));
            }
        }

        function recordStat(idiom, isCorrect) {
            let db = JSON.parse(localStorage.getItem('idiomAppDB'));
            if(isCorrect) db[currentUser].stats[idiom].correct++;
            else db[currentUser].stats[idiom].wrong++;
            localStorage.setItem('idiomAppDB', JSON.stringify(db));
        }

        function saveUserData() {
            let db = JSON.parse(localStorage.getItem('idiomAppDB'));
            db[currentUser].score += sessionScore; 
            localStorage.setItem('idiomAppDB', JSON.stringify(db));
        }

        function showAdminLogin() {
            let pwd = prompt("⚙️ 進入系統後台\n\n請輸入管理者密碼：");
            if(pwd === "@admin123") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                switchTab('admin-panel');
                loadAdminData();
            } else if(pwd !== null) {
                alert("密碼錯誤！");
            }
        }

        function loadAdminData() {
            let db = JSON.parse(localStorage.getItem('idiomAppDB')) || {};
            let tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = "";
            
            for(let user in db) {
                let uData = db[user];
                let maxCorrect = -1, bestIdiom = "無";
                let maxWrong = -1, worstIdiom = "無";
                
                for(let idiom in uData.stats) {
                    if(uData.stats[idiom].correct > maxCorrect && uData.stats[idiom].correct > 0) { maxCorrect = uData.stats[idiom].correct; bestIdiom = idiom; }
                    if(uData.stats[idiom].wrong > maxWrong && uData.stats[idiom].wrong > 0) { maxWrong = uData.stats[idiom].wrong; worstIdiom = idiom; }
                }

                tbody.innerHTML += `<tr style="background:#fff;">
                    <td style="font-weight:bold;">${user}</td>
                    <td style="color:#2c3e50; font-size:1.2rem; font-weight:bold;">${uData.score}</td>
                    <td style="color:#27ae60; font-weight:bold;">${bestIdiom} ${maxCorrect > 0 ? `(${maxCorrect}次)` : ''}</td>
                    <td style="color:#c0392b; font-weight:bold;">${worstIdiom} ${maxWrong > 0 ? `(${maxWrong}次)` : ''}</td>
                </tr>`;
            }
        }

        function clearData() {
            if(confirm("⚠️ 警告！確定要清除所有學習者的分數與資料嗎？此動作無法復原。")) {
                localStorage.removeItem('idiomAppDB');
                loadAdminData();
            }
        }
