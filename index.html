<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>簡單學成語</title>
    <style>
        /* 全局與背景設定 */
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100%; overflow-x: hidden; }
        
        /* 統一背景圖 */
        .bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-image: url('https://i.ibb.co/JjSGd7yK/Gemini-Generated-Image-wnn7e2wnn7e2wnn7.png');
            background-size: cover; background-position: center;
        }

        /* 3D 藝術字體標題 */
        .title-3d {
            font-size: 4rem; font-weight: 900; color: #ffffff; text-align: center; margin: 30px 0 40px 0;
            letter-spacing: 5px;
            text-shadow: 0 1px 0 #cccccc, 0 2px 0 #c9c9c9, 0 3px 0 #bbbbbb, 0 4px 0 #b9b9b9, 0 5px 0 #aaaaaa, 
                         0 6px 1px rgba(0,0,0,.1), 0 0 5px rgba(0,0,0,.1), 0 1px 3px rgba(0,0,0,.3), 
                         0 3px 5px rgba(0,0,0,.2), 0 5px 10px rgba(0,0,0,.25), 0 10px 10px rgba(0,0,0,.2), 0 20px 20px rgba(0,0,0,.15);
        }

        /* 登入介面 */
        #login-screen { height: 100vh; display: flex; justify-content: center; align-items: center; }
        .login-box { background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 350px;}
        .login-box input { padding: 12px; font-size: 1.2rem; border: 2px solid #bdc3c7; border-radius: 8px; margin-bottom: 20px; width: 80%; }
        .login-box button { background: #3498db; color: white; border: none; padding: 12px 30px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; width: 85%; font-weight: bold;}

        /* 音樂控制按鈕 */
        #bgm-btn { position: fixed; top: 20px; right: 20px; background: #e74c3c; color: white; border: none; border-radius: 50%; width: 50px; height: 50px; font-size: 1.5rem; cursor: pointer; z-index: 100; box-shadow: 0 4px 6px rgba(0,0,0,0.3);}

        /* 內容容器 */
        #main-app { display: none; min-height: 100vh; padding: 20px; box-sizing: border-box; background: rgba(255, 255, 255, 0.6); }
        .section { display: none; max-width: 900px; margin: 0 auto; background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .section.active { display: block; }

        /* 主目錄按鈕 */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .idiom-card-btn { background: #34495e; color: white; padding: 20px; text-align: center; border-radius: 10px; cursor: pointer; font-size: 1.5rem; font-weight: bold; transition: transform 0.2s, background 0.3s; }
        .idiom-card-btn:hover { transform: translateY(-5px); background: #2c3e50; }

        /* 圖片故事詞典 (對稱置中) */
        .idiom-detail-header { text-align: center; margin-bottom: 30px; border-bottom: 2px dashed #bdc3c7; padding-bottom: 20px;}
        .idiom-detail-header img { display: block; margin: 0 auto 20px auto; border-radius: 10px; max-width: 80%; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .data-row { display: flex; padding: 12px 0; border-bottom: 1px solid #eee; text-align: left;}
        .data-label { width: 100px; font-weight: bold; color: #fff; background: #8e44ad; text-align: center; padding: 6px; border-radius: 5px; margin-right: 15px; flex-shrink: 0;}
        .data-content { flex: 1; align-self: center; font-size: 1.15rem; color: #333;}

        /* 測驗區塊 */
        .quiz-area { background: #ecf0f1; padding: 25px; border-radius: 10px; margin-top: 30px; border-left: 8px solid #27ae60;}
        .quiz-status { font-weight: bold; color: #7f8c8d; margin-bottom: 15px; font-size: 1.1rem;}
        .quiz-question { margin-bottom: 20px; font-size: 1.3rem; font-weight: bold; color: #2c3e50;}
        .quiz-options button { display: block; width: 100%; text-align: left; padding: 12px; margin: 8px 0; font-size: 1.1rem; border: 2px solid #bdc3c7; background: #fff; border-radius: 8px; cursor: pointer; transition: 0.2s;}
        .quiz-options button:hover { background: #d6eaf8; border-color: #3498db; }
        .quiz-feedback { margin-top: 15px; font-size: 1.1rem; font-weight: bold; display: none; padding: 15px; border-radius: 8px;}
        .feedback-error { background: #fadbd8; color: #c0392b; border: 1px solid #e74c3c; }
        
        /* 導覽按鈕 */
        .back-btn { background: #95a5a6; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1rem; margin-bottom: 20px;}

        /* 後台 */
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .admin-table th, .admin-table td { border: 1px solid #bdc3c7; padding: 10px; text-align: center; }
        .admin-table th { background: #34495e; color: white; }
    </style>
</head>
<body>

    <div class="bg-layer"></div>

    <!-- BGM (請確認路徑，建議將mp3放入同資料夾並改為 './kuuhaku_to_seizyaku.mp3') -->
    <audio id="bgm" loop>
        <audio src="file:///Users/phongnghi/Downloads/123456.mp3" autoplay loop>
        </audio>

    <button id="bgm-btn" onclick="toggleBGM()" style="display: none;">🔈</button>

    <!-- 登入畫面 -->
    <div id="login-screen">
        <div class="login-box">
            <h2 style="color:#2c3e50; font-size: 1.8rem; margin-bottom:30px;">簡單學成語</h2>
            <input type="text" id="username" placeholder="請輸入您的名稱..." autocomplete="off">
            <br>
            <button onclick="startGame()">開始學習</button>
            <br><br>
            <a href="#" style="font-size: 0.9rem; color: #7f8c8d; text-decoration: none;" onclick="showAdminLogin()">我是管理者</a>
        </div>
    </div>

    <!-- 主應用畫面 -->
    <div id="main-app">
        <div class="title-3d">簡單學成語</div>

        <!-- 模組一：成語總覽 (首頁) -->
        <div id="dashboard" class="section active">
            <h2 style="text-align:center; color:#2c3e50; margin-bottom: 30px;">「有X無Y」成語匯集</h2>
            <div class="dashboard-grid" id="dashboard-grid">
                <!-- 動態生成成語按鈕 -->
            </div>
            
            <!-- 語法查詢器附加在主頁下方 -->
            <div style="margin-top: 50px; padding: 20px; background: #e8f8f5; border-radius: 10px; border: 2px solid #1abc9c;">
                <h3>🔍 語法分析器 (詞性判斷)</h3>
                <input type="text" id="syntax-input" placeholder="請輸入包含目標成語的句子..." style="width:70%; padding:10px; font-size:1.1rem; border-radius:5px; border:1px solid #ccc;">
                <button onclick="analyzeSyntax()" style="padding:10px 20px; font-size:1.1rem; background:#1abc9c; color:white; border:none; border-radius:5px; cursor:pointer;">分析</button>
                <div id="query-result" style="margin-top:15px; font-weight:bold; color:#16a085; font-size:1.2rem;"></div>
            </div>
        </div>

        <!-- 模組二：單一成語講解與測驗 -->
        <div id="idiom-detail" class="section">
            <button class="back-btn" onclick="switchTab('dashboard')">⬅ 返回主目錄</button>
            
            <div class="idiom-detail-header" id="detail-header">
                <!-- 動態生成圖片與講解 -->
            </div>

            <div class="quiz-area">
                <h2>📝 隨堂練習 (共 10 題)</h2>
                <div id="quiz-container">
                    <button onclick="startQuiz()" style="padding:12px 30px; font-size:1.2rem; background:#27ae60; color:white; border:none; border-radius:8px; cursor:pointer;">開始測驗</button>
                </div>
            </div>
        </div>

        <!-- 模組三：後台管理 -->
        <div id="admin-panel" class="section">
            <h2>📊 學習者數據後台</h2>
            <button class="back-btn" onclick="switchTab('dashboard')">返回主目錄</button>
            <button onclick="clearData()" style="background: red; color: white; padding:10px; border:none; border-radius:5px; cursor:pointer;">清除所有資料</button>
            <table class="admin-table">
                <thead>
                    <tr><th>名稱</th><th>總分數</th><th>做對最多</th><th>做錯最多</th></tr>
                </thead>
                <tbody id="admin-table-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        // --- 核心資料區 ---
        let currentUser = "";
        let bgmPlaying = false;

        const idiomsData = {
            "有備無患": { zhuyin: "ㄧㄡˇ ㄅㄟˋ ㄨˊ ㄏㄨㄢˋ", pinyin: "yǒu bèi wú huàn", literal: "只要有準備，就不會有後患。", meta: "比喻事先做好準備，就能避免災禍。", img: "https://i.ibb.co/kVyRBfWJ/image.png" },
            "有恃無恐": { zhuyin: "ㄧㄡˇ ㄕˋ ㄨˊ ㄎㄨㄥˇ", pinyin: "yǒu shì wú kǒng", literal: "有依靠而沒有恐懼。", meta: "形容有依靠而無所顧忌。語本《左傳．僖公二十六年》。", img: "https://i.ibb.co/rKNPVsN9/image.png" },
            "有教無類": { zhuyin: "ㄧㄡˇ ㄐㄧㄠˋ ㄨˊ ㄌㄟˋ", pinyin: "yǒu jiào wú lèi", literal: "教育不分對象的類別。", meta: "指施教的對象沒有貧富、貴賤、智愚、善惡之分。", img: "https://i.ibb.co/qFWVFTLp/image.png" },
            "有氣無力": { zhuyin: "ㄧㄡˇ ㄑㄧˋ ㄨˊ ㄌㄧˋ", pinyin: "yǒu qì wú lì", literal: "有呼吸但沒有力氣。", meta: "形容精神不振，虛弱無力的樣子。", img: "https://i.ibb.co/TxCKwgR4/image.png" },
            "有意無意": { zhuyin: "ㄧㄡˇ ㄧˋ ㄨˊ ㄧˋ", pinyin: "yǒu yì wú yì", literal: "又像是有意，又像是無意。", meta: "形容不是特意，或存心不讓人明顯看出來的樣子。", img: "https://i.ibb.co/N61GDv9f/image.png" },
            "有眼無珠": { zhuyin: "ㄧㄡˇ ㄧㄢˇ ㄨˊ ㄓㄨ", pinyin: "yǒu yǎn wú zhū", literal: "長了眼睛卻沒有眼珠。", meta: "比喻沒有眼力，看不出人或事物的價值。", img: "https://i.ibb.co/BKZhjrVJ/image.png" }
        };

        // 題庫設計 (結構示範，系統會從該成語陣列隨機抽10題)
        const questionBank = {
            "有備無患": [
                { q: "颱風來臨前先準備好沙包，____。", options: ["有恃無恐", "有意無意", "有備無患", "有眼無珠"], ans: "有備無患", exp: "遇到災害前先做好準備，故選有備無患。" },
                { q: "出門多帶把傘總是好的，____嘛！", options: ["有教無類", "有備無患", "有氣無力", "有意無意"], ans: "有備無患", exp: "帶傘是為了預防下雨的準備。" },
                { q: "公司平時就該建立危機處理機制，做到____。", options: ["有眼無珠", "有恃無恐", "有備無患", "有意無意"], ans: "有備無患", exp: "危機處理機制屬於事前準備。" },
                { q: "考前多做幾次模擬考，____，上考場才不會慌。", options: ["有備無患", "有恃無恐", "有教無類", "有氣無力"], ans: "有備無患", exp: "模擬考是為正式考試做的準備。" },
                { q: "車上放個急救箱，____，以防萬一。", options: ["有意無意", "有眼無珠", "有恃無恐", "有備無患"], ans: "有備無患", exp: "急救箱是預防萬一的物品。" },
                { q: "他做事總是未雨綢繆，____，所以很少出錯。", options: ["有備無患", "有教無類", "有氣無力", "有意無意"], ans: "有備無患", exp: "未雨綢繆與有備無患意思相近。" },
                { q: "為防地震停電，家裡備妥手電筒，這叫____。", options: ["有恃無恐", "有教無類", "有備無患", "有眼無珠"], ans: "有備無患", exp: "準備手電筒是為了預防停電。" },
                { q: "多學一項技能____，未來找工作更容易。", options: ["有教無類", "有氣無力", "有意無意", "有備無患"], ans: "有備無患", exp: "多學技能是為了未來的準備。" },
                { q: "出國旅遊前先買好保險，____。", options: ["有備無患", "有恃無恐", "有眼無珠", "有意無意"], ans: "有備無患", exp: "買保險是預防突發狀況。" },
                { q: "他把資料備份了三份，真是做到____了。", options: ["有意無意", "有氣無力", "有備無患", "有教無類"], ans: "有備無患", exp: "備份資料是為了防止檔案遺失。" }
            ],
            // 由於篇幅限制，以下成語提供模板，您可依此格式擴充至 50 題
            "有恃無恐": [
                { q: "他因為有總經理當靠山，在公司裡總是____。", options: ["有恃無恐", "有氣無力", "有眼無珠", "有備無患"], ans: "有恃無恐", exp: "有靠山就不害怕，形容有恃無恐。" },
                { q: "歹徒自以為人質在手，____地向警方叫囂。", options: ["有教無類", "有恃無恐", "有意無意", "有備無患"], ans: "有恃無恐", exp: "有人質作為依靠而毫不畏懼。" },
                { q: "仗著家裡有錢，他____地到處惹事生非。", options: ["有備無患", "有眼無珠", "有恃無恐", "有氣無力"], ans: "有恃無恐", exp: "仗著金錢勢力而為非作歹。" }
            ],
            "有教無類": [
                { q: "孔子提倡「____」的精神，願意耐心教導任何學生。", options: ["有恃無恐", "有教無類", "有備無患", "有意無意"], ans: "有教無類", exp: "教育沒有階級之分。" },
                { q: "一所好學校應該做到____，不放棄任何一個孩子。", options: ["有教無類", "有氣無力", "有眼無珠", "有備無患"], ans: "有教無類", exp: "平等待遇是教育的核心。" },
            ],
            "有氣無力": [
                { q: "生了一場大病後，他整天躺在床上____的。", options: ["有恃無恐", "有眼無珠", "有氣無力", "有教無類"], ans: "有氣無力", exp: "生病導致身體虛弱沒有力氣。" },
                { q: "餓了三天三夜，他說話的聲音____。", options: ["有教無類", "有氣無力", "有備無患", "有意無意"], ans: "有氣無力", exp: "飢餓導致沒有力氣發聲。" },
            ],
            "有意無意": [
                { q: "他____地提起那件往事，似乎在試探我的反應。", options: ["有眼無珠", "有恃無恐", "有意無意", "有氣無力"], ans: "有意無意", exp: "表面不在意，其實暗中觀察。" },
                { q: "開會時老闆____地看著他，讓他感到很緊張。", options: ["有備無患", "有意無意", "有教無類", "有氣無力"], ans: "有意無意", exp: "不經意間的眼神暗示。" }
            ],
            "有眼無珠": [
                { q: "這麼好的古董你當成垃圾，真是____！", options: ["有教無類", "有意無意", "有備無患", "有眼無珠"], ans: "有眼無珠", exp: "看不出珍貴事物的價值。" },
                { q: "我當初真是____，居然會相信他這個騙子。", options: ["有氣無力", "有眼無珠", "有恃無恐", "有備無患"], ans: "有眼無珠", exp: "識人不清，無法分辨好壞。" }
            ]
        };

        // --- 介面控制邏輯 ---
        function startGame() {
            const nameInput = document.getElementById('username').value.trim();
            if(!nameInput) { alert("請先輸入名稱！"); return; }
            currentUser = nameInput;
            
            // 嘗試播放音樂 (因為使用者剛點擊了按鈕，所以被允許)
            const audio = document.getElementById('bgm');
            audio.volume = 0.5;
            audio.play().then(() => {
                bgmPlaying = true;
                document.getElementById('bgm-btn').innerText = "🔊";
            }).catch(e => console.log("音樂播放需手動開啟"));

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            document.getElementById('bgm-btn').style.display = 'block';
            
            initUserStats();
            renderDashboard();
        }

        function toggleBGM() {
            const audio = document.getElementById('bgm');
            const btn = document.getElementById('bgm-btn');
            if(bgmPlaying) { audio.pause(); btn.innerText = "🔈"; } 
            else { audio.play(); btn.innerText = "🔊"; }
            bgmPlaying = !bgmPlaying;
        }

        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            window.scrollTo(0,0);
        }

        function renderDashboard() {
            const grid = document.getElementById('dashboard-grid');
            grid.innerHTML = "";
            let counter = 1;
            for(let key in idiomsData) {
                grid.innerHTML += `<div class="idiom-card-btn" onclick="openIdiom('${key}')">${counter}. ${key}</div>`;
                counter++;
            }
        }

        // --- 測驗系統狀態 ---
        let currentActiveIdiom = "";
        let currentQuizList = [];
        let currentQIdx = 0;
        let currentQAttempts = 0;
        let sessionScore = 0;

        function openIdiom(idiomName) {
            currentActiveIdiom = idiomName;
            const data = idiomsData[idiomName];
            
            // 渲染頂部圖片與解說 (集中對稱)
            document.getElementById('detail-header').innerHTML = `
                <img src="${data.img}" alt="${idiomName}">
                <div style="max-width: 600px; margin: 0 auto;">
                    <div class="data-row"><div class="data-label">成 語</div><div class="data-content" style="font-weight:bold; font-size:1.8rem; color:#8e44ad;">${idiomName}</div></div>
                    <div class="data-row"><div class="data-label">注 音</div><div class="data-content">${data.zhuyin}</div></div>
                    <div class="data-row"><div class="data-label">漢語拼音</div><div class="data-content">${data.pinyin}</div></div>
                    <div class="data-row"><div class="data-label">字 面 義</div><div class="data-content">${data.literal}</div></div>
                    <div class="data-row"><div class="data-label">隱 喻 義</div><div class="data-content">${data.meta}</div></div>
                </div>
            `;
            
            // 重置測驗區塊
            document.getElementById('quiz-container').innerHTML = `
                <p>本測驗將隨機抽取 10 題，每題有 3 次作答機會。錯第 3 次將不計分並公布詳解。</p>
                <button onclick="startQuiz()" style="padding:12px 30px; font-size:1.2rem; background:#27ae60; color:white; border:none; border-radius:8px; cursor:pointer;">開始測驗</button>
            `;
            
            switchTab('idiom-detail');
        }

        function startQuiz() {
            // 從該成語題庫抽取最多 10 題 (如果題庫不足10題則全取)
            let pool = [...questionBank[currentActiveIdiom]];
            // 補充假題目以便測試 (若您的題庫達50題，則移除此行)
            while(pool.length < 10) { pool.push(pool[0]); } 

            let shuffled = pool.sort(() => 0.5 - Math.random());
            currentQuizList = shuffled.slice(0, 10);
            currentQIdx = 0;
            sessionScore = 0;
            
            showQuestion();
        }

        function showQuestion() {
            if(currentQIdx >= currentQuizList.length) { endQuiz(); return; }
            currentQAttempts = 0;
            const qData = currentQuizList[currentQIdx];
            
            let optionsHtml = "";
            qData.options.forEach(opt => {
                optionsHtml += `<button onclick="checkAnswer('${opt}', this)">${opt}</button>`;
            });

            document.getElementById('quiz-container').innerHTML = `
                <div class="quiz-status">題目： ${currentQIdx + 1} / 10 &nbsp;&nbsp;|&nbsp;&nbsp; 目前得分：${sessionScore}</div>
                <div class="quiz-question">${qData.q}</div>
                <div class="quiz-options" id="options-box">${optionsHtml}</div>
                <div id="q-feedback" class="quiz-feedback"></div>
                <button id="next-btn" onclick="nextQuestion()" style="display:none; margin-top:20px; padding:10px 20px; background:#3498db; color:white; border:none; border-radius:5px; cursor:pointer;">下一題 ➡</button>
            `;
        }

        function checkAnswer(selected, btnElement) {
            const qData = currentQuizList[currentQIdx];
            const feedbackBox = document.getElementById('q-feedback');
            
            if(selected === qData.ans) {
                // 答對
                btnElement.style.background = "#2ecc71";
                btnElement.style.color = "white";
                feedbackBox.className = "quiz-feedback";
                feedbackBox.style.background = "#d5f5e3";
                feedbackBox.style.color = "#27ae60";
                feedbackBox.innerHTML = `✅ 答對了！<br><span style="font-size:1rem; font-weight:normal;">解析：${qData.exp}</span>`;
                feedbackBox.style.display = "block";
                sessionScore += 10;
                recordStat(currentActiveIdiom, true);
                lockOptions();
            } else {
                // 答錯
                currentQAttempts++;
                btnElement.style.background = "#e74c3c";
                btnElement.style.color = "white";
                btnElement.disabled = true;
                
                if(currentQAttempts >= 3) {
                    // 錯3次，公布答案
                    feedbackBox.className = "quiz-feedback feedback-error";
                    feedbackBox.innerHTML = `❌ 錯誤 3 次！<br>正確答案是：<strong>${qData.ans}</strong><br><span style="font-size:1rem; font-weight:normal;">解析：${qData.exp}</span>`;
                    feedbackBox.style.display = "block";
                    recordStat(currentActiveIdiom, false);
                    lockOptions();
                } else {
                    feedbackBox.className = "quiz-feedback feedback-error";
                    feedbackBox.innerHTML = `❌ 答錯了！還剩 ${3 - currentQAttempts} 次機會。`;
                    feedbackBox.style.display = "block";
                }
            }
        }

        function lockOptions() {
            const btns = document.getElementById('options-box').querySelectorAll('button');
            btns.forEach(b => b.disabled = true);
            document.getElementById('next-btn').style.display = "block";
        }

        function nextQuestion() {
            currentQIdx++;
            showQuestion();
        }

        function endQuiz() {
            saveUserData();
            document.getElementById('quiz-container').innerHTML = `
                <h2 style="color:#2c3e50; text-align:center;">測驗結束！</h2>
                <div style="text-align:center; font-size:3rem; font-weight:bold; color:#e74c3c; margin:20px 0;">${sessionScore} 分</div>
                <div style="text-align:center;">
                    <button onclick="startQuiz()" style="padding:10px 20px; font-size:1.2rem; background:#3498db; color:white; border:none; border-radius:5px; cursor:pointer; margin:5px;">重新挑戰</button>
                    <button onclick="switchTab('dashboard')" style="padding:10px 20px; font-size:1.2rem; background:#95a5a6; color:white; border:none; border-radius:5px; cursor:pointer; margin:5px;">回主目錄</button>
                </div>
            `;
        }

        // --- 語法查詢器邏輯 ---
        function analyzeSyntax() {
            const text = document.getElementById('syntax-input').value;
            const resBox = document.getElementById('query-result');
            let foundIdiom = Object.keys(idiomsData).find(i => text.includes(i));
            
            if(!foundIdiom) { resBox.innerHTML = "<span style='color:#e74c3c'>未偵測到指定的成語！</span>"; return; }
            
            let role = "未知";
            if (text.includes(foundIdiom + "的")) role = "[定語] (修飾名詞)";
            else if (text.includes(foundIdiom + "地")) role = "[狀語] (修飾動詞)";
            else if (text.endsWith(foundIdiom) || text.endsWith(foundIdiom+"。") || text.includes("是" + foundIdiom)) role = "[謂語] 或 [賓語]";
            else if (text.includes("得" + foundIdiom)) role = "[補語] (補充狀態)";
            else if (text.startsWith(foundIdiom)) role = "[主語]";
            else role = "[謂語] (作核心動態描述)";

            resBox.innerHTML = `目標成語：<span style="color:#2c3e50">${foundIdiom}</span><br>語法角色推測：<span style="color:#e67e22">${role}</span>`;
        }

        // --- 後台數據管理 ---
        function initUserStats() {
            let db = JSON.parse(localStorage.getItem('idiomAppDB')) || {};
            if(!db[currentUser]) {
                db[currentUser] = { score: 0, stats: {} };
                for(let key in idiomsData) db[currentUser].stats[key] = { correct: 0, wrong: 0 };
                localStorage.setItem('idiomAppDB', JSON.stringify(db));
            }
        }

        function recordStat(idiom, isCorrect) {
            let db = JSON.parse(localStorage.getItem('idiomAppDB'));
            if(isCorrect) db[currentUser].stats[idiom].correct++;
            else db[currentUser].stats[idiom].wrong++;
            localStorage.setItem('idiomAppDB', JSON.stringify(db));
        }

        function saveUserData() {
            let db = JSON.parse(localStorage.getItem('idiomAppDB'));
            db[currentUser].score += sessionScore; 
            localStorage.setItem('idiomAppDB', JSON.stringify(db));
        }

        function showAdminLogin() {
            let acc = prompt("請輸入管理者帳號：");
            let pwd = prompt("請輸入密碼：");
            if(acc === "admin_2026" && pwd === "@admin123") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('bgm-btn').style.display = 'block';
                switchTab('admin-panel');
                loadAdminData();
            } else {
                alert("帳號或密碼錯誤！");
            }
        }

        function loadAdminData() {
            let db = JSON.parse(localStorage.getItem('idiomAppDB')) || {};
            let tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = "";
            
            for(let user in db) {
                let uData = db[user];
                let maxCorrect = -1, bestIdiom = "無資料";
                let maxWrong = -1, worstIdiom = "無資料";
                
                for(let idiom in uData.stats) {
                    if(uData.stats[idiom].correct > maxCorrect && uData.stats[idiom].correct > 0) { maxCorrect = uData.stats[idiom].correct; bestIdiom = idiom; }
                    if(uData.stats[idiom].wrong > maxWrong && uData.stats[idiom].wrong > 0) { maxWrong = uData.stats[idiom].wrong; worstIdiom = idiom; }
                }

                tbody.innerHTML += `<tr style="background:#fff;">
                    <td>${user}</td>
                    <td>${uData.score}</td>
                    <td style="color:#27ae60; font-weight:bold;">${bestIdiom} ${maxCorrect > 0 ? `(${maxCorrect}次)` : ''}</td>
                    <td style="color:#c0392b; font-weight:bold;">${worstIdiom} ${maxWrong > 0 ? `(${maxWrong}次)` : ''}</td>
                </tr>`;
            }
        }

        function clearData() {
            if(confirm("確定要清除所有資料嗎？此動作無法復原。")) {
                localStorage.removeItem('idiomAppDB');
                loadAdminData();
            }
        }
    </script>
</body>
