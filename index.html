<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏮簡單學成語✨</title>
    <style>
        /* 全局與背景設定 */
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100%; overflow-x: hidden; background-color: #f4f4f4;}
        
        .bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            /* 已更換為最新指定背景圖 */
            background-image: url('https://i.ibb.co/YT82HPYv/Gemini-Generated-Image-wkgvbwwkgvbwwkgv.png');
            background-size: cover; background-position: center; filter: brightness(0.9);
        }

        /* 首頁標題 (標楷體、黑黃配色) */
        .main-title {
            font-family: 'BiauKai', '標楷體', 'DFKai-SB', serif;
            font-size: 4.5rem; font-weight: bold; color: #f1c40f; text-align: center; margin-bottom: 20px;
            text-shadow: 
                -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000,
                4px 4px 0 #000, 6px 6px 15px rgba(0,0,0,0.6);
            letter-spacing: 4px; z-index: 10;
        }

        /* 登入介面 */
        #login-screen { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .login-box { background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 350px; border-top: 8px solid #f1c40f;}
        .login-box input { padding: 12px; font-size: 1.2rem; border: 2px solid #bdc3c7; border-radius: 8px; margin-bottom: 20px; width: 80%; text-align: center;}
        .login-box button { background: #3498db; color: white; border: none; padding: 12px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; width: 85%; font-weight: bold; margin-bottom: 10px; transition: 0.2s;}
        .login-box button:hover { background: #2980b9; transform: translateY(-2px);}
        .leaderboard-btn { background: #e67e22 !important; }
        .leaderboard-btn:hover { background: #d35400 !important; }

        /* 音樂控制按鈕 */
        .music-btn { 
            position: fixed; top: 20px; right: 20px; font-size: 2.2rem; cursor: pointer; z-index: 100; 
            background: #fff; border-radius: 50%; width: 65px; height: 65px; display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 4px solid #bdc3c7; transition: all 0.3s;
        }
        .music-btn.playing {
            border-color: #f1c40f; color: #e74c3c;
            animation: pulse-ring 2s infinite, spin-slow 8s linear infinite;
        }
        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(241, 196, 15, 0); } 100% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0); } }
        @keyframes spin-slow { 100% { transform: rotate(360deg); } }

        /* 右下角設定(後台)按鈕 */
        .settings-btn {
            position: fixed; bottom: 20px; right: 20px; font-size: 2rem; cursor: pointer; z-index: 100;
            background: rgba(255,255,255,0.8); border-radius: 50%; width: 50px; height: 50px; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.3); transition: 0.3s;
        }
        .settings-btn:hover { background: #fff; transform: rotate(90deg); }

        /* 內容容器 */
        #main-app { display: none; min-height: 100vh; padding: 20px; box-sizing: border-box; background: rgba(255, 255, 255, 0.7); }
        .section { display: none; max-width: 900px; margin: 0 auto; background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .section.active { display: block; }

        /* 主目錄按鈕 */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .idiom-card-btn { background: #34495e; color: #f1c40f; padding: 20px; text-align: center; border-radius: 10px; cursor: pointer; font-size: 1.8rem; font-family: '標楷體', serif; font-weight: bold; transition: transform 0.2s, background 0.3s; border: 2px solid #2c3e50;}
        .idiom-card-btn:hover { transform: translateY(-5px); background: #2c3e50; color: #fff;}
        .start-training-btn { grid-column: 1 / -1; background: #e74c3c; color: white; border: none; padding: 20px; font-size: 1.8rem; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px; box-shadow: 0 5px 15px rgba(231,76,60,0.4); transition: 0.3s;}
        .start-training-btn:hover { background: #c0392b; transform: translateY(-3px);}

        /* 情境造句特訓區塊 */
        .training-header { text-align: center; margin-bottom: 20px; border-bottom: 2px dashed #bdc3c7; padding-bottom: 20px;}
        .training-header img { display: block; margin: 0 auto 15px auto; border-radius: 10px; max-width: 80%; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .training-title { font-size: 2.5rem; color: #8e44ad; font-weight: bold; margin-bottom: 10px; }
        .training-def { font-size: 1.2rem; color: #34495e; margin-bottom: 10px; background: #f0f3f4; padding: 10px; border-radius: 5px; border-left: 5px solid #3498db;}
        
        .corpus-examples { background: #fdfefe; padding: 20px; border-radius: 8px; border: 1px solid #d5d8dc; margin-bottom: 20px;}
        .corpus-examples h4 { margin-top: 0; color: #16a085; border-bottom: 1px solid #16a085; padding-bottom: 5px;}
        .corpus-examples ul { padding-left: 20px; margin: 0; line-height: 1.6; font-size: 1.1rem; color: #2c3e50;}
        .corpus-examples li { margin-bottom: 8px; }
        .highlight-idiom { color: #e74c3c; font-weight: bold; }

        .writing-area { background: #ecf0f1; padding: 20px; border-radius: 10px; margin-top: 20px;}
        .writing-area h3 { margin-top: 0; color: #2980b9;}
        .writing-area textarea { width: 100%; height: 100px; padding: 15px; font-size: 1.2rem; border-radius: 8px; border: 2px solid #bdc3c7; box-sizing: border-box; resize: vertical;}
        .writing-area button { display: block; width: 100%; background: #27ae60; color: white; border: none; padding: 15px; font-size: 1.3rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; transition: 0.2s;}
        .writing-area button:hover { background: #2196f3; }

        .feedback-box { display: none; background: #fff; padding: 20px; border-radius: 8px; border-left: 8px solid #f1c40f; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); font-size: 1.15rem; line-height: 1.6;}
        
        .next-btn { display: none; width: 100%; background: #9b59b6; color: white; border: none; padding: 15px; font-size: 1.3rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; transition: 0.2s;}
        .next-btn:hover { background: #8e44ad; }

        .back-btn { background: #95a5a6; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1rem; margin-bottom: 20px;}

        /* 表格與模態框 */
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .admin-table th, .admin-table td { border: 1px solid #bdc3c7; padding: 12px; text-align: center; background: white;}
        .admin-table th { background: #34495e; color: white; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;}
        .modal-content { background: #fff; padding: 30px; border-radius: 15px; width: 100%; max-width: 700px; max-height: 85vh; overflow-y: auto; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 2rem; cursor: pointer; color: #7f8c8d; }
    </style>
</head>
<body>

    <div class="bg-layer"></div>

    <audio id="bgm" loop preload="auto">
        <source src="https://otologic.jp/sounds/bgm/pre/kuuhaku%20to%20seizyaku.mp3" type="audio/mpeg">
    </audio>

    <div id="bgm-btn" class="music-btn" onclick="toggleBGM()" title="開啟/關閉音樂">🎵</div>

    <div class="settings-btn" onclick="showAdminLogin()" title="系統後台">⚙️</div>

    <!-- 登入與排行榜畫面 -->
    <div id="login-screen">
        <div class="main-title">🏮簡單學成語✨</div>
        <div class="login-box">
            <h3 style="color:#2c3e50; margin-top:0;">歡迎進入成語世界</h3>
            <input type="text" id="username" placeholder="請輸入您的姓名..." autocomplete="off">
            <button onclick="startGame()">▶ 開始學習</button>
            <button class="leaderboard-btn" onclick="openLeaderboard()">🏆 學習排名榜</button>
        </div>
    </div>

    <!-- 學習主畫面 -->
    <div id="main-app">
        <!-- 模組一：成語總覽 (首頁) -->
        <div id="dashboard" class="section active">
            <div class="main-title" style="font-size: 3.5rem;">🏮簡單學成語✨</div>
            <h2 style="text-align:center; color:#2c3e50; margin-bottom: 30px;">「有X無Y」成語匯集</h2>
            <div class="dashboard-grid" id="dashboard-grid">
                <!-- 動態生成卡片 -->
            </div>
            
            <button class="start-training-btn" onclick="startTrainingSequence()">👉 開始情境造句特訓</button>
            
            <div style="margin-top: 50px; padding: 25px; background: #e8f8f5; border-radius: 15px; border: 2px solid #1abc9c; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                <h3 style="margin-top:0; color:#16a085;">🔍 語法分析器 (詞性判斷)</h3>
                <input type="text" id="syntax-input" placeholder="請輸入包含目標成語的句子..." style="width:75%; padding:12px; font-size:1.1rem; border-radius:5px; border:1px solid #ccc;">
                <button onclick="analyzeSyntax()" style="padding:12px 25px; font-size:1.1rem; background:#1abc9c; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">分析</button>
                <div id="query-result" style="margin-top:15px; font-weight:bold; color:#2c3e50; font-size:1.2rem; line-height: 1.6;"></div>
            </div>
        </div>

        <!-- 模組二：造句特訓區 -->
        <div id="training-section" class="section">
            <button class="back-btn" onclick="switchTab('dashboard')">⬅ 返回主目錄</button>
            
            <div id="training-content">
                <!-- JS 動態生成造句內容 -->
            </div>
        </div>

        <!-- 模組三：結算畫面 -->
        <div id="result-section" class="section">
            <h2 style="text-align:center; color:#2c3e50; font-size:2.5rem;">🎉 特訓完成！</h2>
            <div style="text-align:center; font-size:5rem; font-weight:bold; color:#e74c3c; margin:20px 0; text-shadow: 2px 2px 0px #fadbd8;" id="final-score-display">0 分</div>
            <div id="final-encouragement" style="text-align:center; font-size:1.5rem; color:#27ae60; font-weight:bold; margin-bottom: 30px;"></div>
            <div style="text-align:center;">
                <button onclick="switchTab('dashboard')" style="padding:15px 30px; font-size:1.3rem; background:#3498db; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold;">🏠 回到主頁</button>
            </div>
        </div>

        <!-- 模組四：後台管理 -->
        <div id="admin-panel" class="section">
            <h2>⚙️ 學習者數據後台</h2>
            <button class="back-btn" onclick="switchTab('dashboard')">返回主目錄</button>
            <button onclick="clearData()" style="background: red; color: white; padding:10px; border:none; border-radius:5px; cursor:pointer; float:right;">清除所有資料</button>
            <table class="admin-table">
                <thead>
                    <tr><th>學習者名稱</th><th>總分數</th></tr>
                </thead>
                <tbody id="admin-table-body"></tbody>
            </table>
        </div>
    </div>

    <!-- 模態框：排行榜 -->
    <div id="leaderboard-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('leaderboard-modal')">&times;</span>
            <h2 style="text-align:center; color:#e67e22;">🏆 學習排名榜</h2>
            <table class="admin-table">
                <thead>
                    <tr><th>排名</th><th>學習者</th><th>累計總分</th></tr>
                </thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        // --- 核心資料區 ---
        let currentUser = "";
        
        // 讀取音樂狀態設定 (統一管理)
        let isUserMuted = localStorage.getItem('idiomAppMuted') === 'true';
        let bgmPlaying = false;

        const trainingData = [
            {
                name: "有備無患",
                img: "https://i.ibb.co/kVyRBfWJ/image.png",
                def: "事先做好準備，就能避免災禍。",
                collocation: "常接「做到～」、「抱著～的想法」，用於形容事前防範。",
                examples: [
                    "從事這份工作，也許終其一生不會遇到自殺當事人，但<span class='highlight-idiom'>有備無患</span>，多一分準備也是好的。[cite: 6]",
                    "病情嚴重的那一天，柏楊夫人為了<span class='highlight-idiom'>有備無患</span>，就翻箱倒櫃找出了我那一萬元。[cite: 6]",
                    "未雨綢繆才能<span class='highlight-idiom'>有備無患</span>，幫助個人落實學習目標的執行。[cite: 6]",
                    "只要<span class='highlight-idiom'>有備無患</span>，就能「柳暗花明又一村」。[cite: 6]",
                    "我舒服的跑著，抱著「<span class='highlight-idiom'>有備無患</span>」的想法來對應。[cite: 6]"
                ]
            },
            {
                name: "有恃無恐",
                img: "https://i.ibb.co/rKNPVsN9/image.png",
                def: "形容有依靠而無所顧忌。",
                collocation: "常接「地 + 動詞 (如說、做)」、「顯得～」，形容仗勢欺人、無所畏懼。",
                examples: [
                    "偏差的青少年，面臨前所未有的窘境；那些<span class='highlight-idiom'>有恃無恐</span>的孩子，竟然對著教師挑釁。[cite: 3]",
                    "受罰，父母親又替他開罪，孩子就<span class='highlight-idiom'>有恃無恐</span>，變本加厲。[cite: 3]",
                    "生產者和消費者之間不公平，也是廠商<span class='highlight-idiom'>有恃無恐</span>的主因。[cite: 3]",
                    "既然他可以視而不見而照樣吸菸，當然是<span class='highlight-idiom'>有恃無恐</span>。[cite: 3]",
                    "仗恃著有錢而法院又輕判，因而<span class='highlight-idiom'>有恃無恐</span>。[cite: 3]"
                ]
            },
            {
                name: "有教無類",
                img: "https://i.ibb.co/qFWVFTLp/image.png",
                def: "教育不分對象的階級、貧富、貴賤。",
                collocation: "常接「～的精神」、「做到～」，形容教育公平。",
                examples: [
                    "沒有預設立場的教師，才能發揮<span class='highlight-idiom'>有教無類</span>的精神。[cite: 4]",
                    "循循善誘；胸懷愛護之心，才能做到<span class='highlight-idiom'>有教無類</span>。[cite: 4]",
                    "孔子是萬世師表，<span class='highlight-idiom'>有教無類</span>，每個中國人的生命中都留有孔子。[cite: 4]",
                    "也從許多同學的改變中，體會到「<span class='highlight-idiom'>有教無類</span>、朽木可雕」的深意。[cite: 4]",
                    "傳統，而其中尤以仁愛為本、<span class='highlight-idiom'>有教無類</span>、因材施教。[cite: 4]"
                ]
            },
            {
                name: "有氣無力",
                img: "https://i.ibb.co/TxCKwgR4/image.png",
                def: "形容精神不振，虛弱無力的樣子。",
                collocation: "常接「地 + 動詞 (如說、躺、喘氣)」，形容極度疲憊。",
                examples: [
                    "他連續高燒了三天，整個人顯得<span class='highlight-idiom'>有氣無力</span>的。[cite: 8]",
                    "剛跑完馬拉松，參賽者們紛紛癱坐在地上，<span class='highlight-idiom'>有氣無力</span>地喘著粗氣。[cite: 8]",
                    "手術過後，病人躺在病床上，<span class='highlight-idiom'>有氣無力</span>地向家屬點了點頭。[cite: 8]",
                    "餓了整整一天，他現在連走路都<span class='highlight-idiom'>有氣無力</span>。[cite: 8]",
                    "經歷了一場大病，他看起來面色蒼白，<span class='highlight-idiom'>有氣無力</span>。[cite: 8]"
                ]
            },
            {
                name: "有意無意",
                img: "https://i.ibb.co/N61GDv9f/image.png",
                def: "形容不是特意，或存心不讓人明顯看出來的樣子。",
                collocation: "常接「地 + 動詞 (如看、說、透露)」，形容似有若無的舉動。",
                examples: [
                    "妯娌是一個集團，常常在她面前<span class='highlight-idiom'>有意無意</span>談自己當年的嫁妝多麼多麼豐盛。[cite: 7]",
                    "有時甚至提早到演講對象經常聚集的地方，<span class='highlight-idiom'>有意無意</span>地聽聽他們之間談論的是什麼話題？[cite: 7]",
                    "開始接觸別人，因此跟朋友相處時會<span class='highlight-idiom'>有意無意</span>地比較別人的先生或太太。[cite: 7]",
                    "許多父母<span class='highlight-idiom'>有意無意</span>地讓他們的子女忘記中文。[cite: 7]",
                    "而王太太卻又<span class='highlight-idiom'>有意無意</span>地將椅子挪向約翰。[cite: 7]"
                ]
            },
            {
                name: "有眼無珠",
                img: "https://i.ibb.co/BKZhjrVJ/image.png",
                def: "比喻沒有眼力，看不出人或事物的真實價值。",
                collocation: "常接「真是～」、「罵人～」，形容識人不清。",
                examples: [
                    "那位嫁到劇務的小姐，也是屬於「<span class='highlight-idiom'>有眼無珠</span>」之類。[cite: 5]",
                    "這份罪是上帝的懲罰，那個<span class='highlight-idiom'>有眼無珠</span>的上帝，不要也罷。[cite: 5]",
                    "不見綠葉，但聞奇香，<span class='highlight-idiom'>有眼無珠</span>，憾得不值。[cite: 5]",
                    "現代女性選擇獨身、害怕婚姻，免得<span class='highlight-idiom'>有眼無珠</span>像《紅樓夢》中的賈迎春。[cite: 5]",
                    "客老爺要上朝廷當大官，恕小人<span class='highlight-idiom'>有眼無珠</span>，一時多多冒犯老爺！[cite: 5]"
                ]
            }
        ];

        // --- 介面控制與音樂邏輯 ---
        
        // 網頁載入時初始化音樂狀態
        window.addEventListener('DOMContentLoaded', () => {
            const audio = document.getElementById('bgm');
            audio.volume = 0.5;
            const btn = document.getElementById('bgm-btn');
            
            if (!isUserMuted) {
                // 嘗試自動播放
                audio.play().then(() => {
                    bgmPlaying = true;
                    btn.classList.add('playing');
                }).catch(e => { console.log("等待使用者互動後播放"); });
            } else {
                btn.classList.remove('playing');
            }
            renderDashboard();
        });

        function startGame() {
            const nameInput = document.getElementById('username').value.trim();
            if(!nameInput) { alert("請先輸入您的姓名！"); return; }
            currentUser = nameInput;
            
            const audio = document.getElementById('bgm');
            // 如果使用者沒有設定過靜音，進入時確保播放
            if(!isUserMuted) {
                audio.play().then(() => {
                    bgmPlaying = true;
                    document.getElementById('bgm-btn').classList.add('playing');
                }).catch(e => console.log("無法自動播放"));
            }

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            
            initUserStats();
        }

        function toggleBGM() {
            const audio = document.getElementById('bgm');
            const btn = document.getElementById('bgm-btn');
            if(bgmPlaying) { 
                audio.pause(); 
                btn.classList.remove('playing');
                bgmPlaying = false;
                isUserMuted = true;
                localStorage.setItem('idiomAppMuted', 'true');
            } else { 
                audio.play(); 
                btn.classList.add('playing');
                bgmPlaying = true;
                isUserMuted = false;
                localStorage.setItem('idiomAppMuted', 'false');
            }
        }

        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            window.scrollTo(0,0);
        }

        function renderDashboard() {
            const grid = document.getElementById('dashboard-grid');
            grid.innerHTML = "";
            trainingData.forEach((data, index) => {
                grid.innerHTML += `<div class="idiom-card-btn">${index + 1}. ${data.name}</div>`;
            });
        }

        // --- 造句特訓系統 ---
        let currentTrainIdx = 0;
        let sessionTotalScore = 0;

        function startTrainingSequence() {
            currentTrainIdx = 0;
            sessionTotalScore = 0;
            loadTrainingUI();
            switchTab('training-section');
        }

        function loadTrainingUI() {
            const data = trainingData[currentTrainIdx];
            const contentBox = document.getElementById('training-content');
            
            let examplesHTML = "";
            data.examples.forEach(ex => { examplesHTML += `<li>${ex}</li>`; });

            contentBox.innerHTML = `
                <div class="training-header">
                    <img src="${data.img}" alt="${data.name}">
                    <div class="training-title">${data.name}</div>
                    <div class="training-def"><strong>💡 簡短釋義：</strong>${data.def}</div>
                    <div class="training-def" style="background:#e8f8f5; border-color:#1abc9c;"><strong>🔗 常見搭配/情境：</strong>${data.collocation}</div>
                </div>

                <div class="corpus-examples">
                    <h4>📚 語料庫真實例句</h4>
                    <ul>${examplesHTML}</ul>
                </div>

                <div class="writing-area">
                    <h3>✍️ 換你大展身手！</h3>
                    <p style="color:#7f8c8d; margin-top:0;">請參考上方例句，結合自己的生活經驗，用「<strong>${data.name}</strong>」造一個完整的句子：</p>
                    <textarea id="sentence-input" placeholder="請在此輸入您的造句..."></textarea>
                    <button id="submit-sentence-btn" onclick="submitSentence()">送出造句</button>
                    
                    <div id="feedback-box" class="feedback-box"></div>
                    <button id="next-train-btn" class="next-btn" onclick="nextTraining()">進入下一個成語 ➡</button>
                </div>
            `;
        }

        function submitSentence() {
            const inputField = document.getElementById('sentence-input');
            let input = inputField.value.trim();
            const data = trainingData[currentTrainIdx];
            const feedbackBox = document.getElementById('feedback-box');
            
            if(input === "") { alert("請先輸入句子喔！"); return; }
            
            inputField.disabled = true;
            document.getElementById('submit-sentence-btn').style.display = 'none';

            let score = 0;
            let fbHTML = "";

            // AI 模擬批改邏輯
            if(!input.includes(data.name)) {
                score = 1;
                fbHTML = `
                    <div style="color:#c0392b;"><strong>❌ 批改與修正：</strong>你好像沒有用到「${data.name}」喔！<br><em>建議修正：請嘗試把成語加入句子中。</em></div>
                    <div style="color:#e67e22; margin-top:10px; font-size:1.4rem;"><strong>🏆 評分： ${score} / 5 分</strong></div>
                    <div style="color:#27ae60; margin-top:10px;"><strong>💡 給你的鼓勵：</strong>萬事起頭難，再看一次上面的例句，相信你一定能寫出來的！加油！</div>
                `;
            } else {
                // 檢查是否抄襲例句
                let isTooSimilar = data.examples.some(ex => {
                    let cleanEx = ex.replace(/[，。！「」\[\]a-zA-Z:0-9\s]/g, "");
                    let cleanIn = input.replace(/[，。！「」\s]/g, "");
                    return cleanEx.includes(cleanIn) || cleanIn.includes(cleanEx);
                });

                if(isTooSimilar && input.length < 20) {
                    score = 3;
                    fbHTML = `
                        <div style="color:#c0392b;"><strong>⚠️ 批改與修正：</strong>語法正確，但這句話跟例句太相似了喔！<br><em>建議修正：請試著替換主詞或情境，寫出你獨一無二的句子。</em></div>
                        <div style="color:#e67e22; margin-top:10px; font-size:1.4rem;"><strong>🏆 評分： ${score} / 5 分</strong></div>
                        <div style="color:#27ae60; margin-top:10px;"><strong>💡 給你的鼓勵：</strong>你已經掌握了基本用法，試著結合自己的生活經驗，一定能造出更棒的句子！</div>
                    `;
                } else if(input.length < data.name.length + 6) {
                    score = 2;
                    fbHTML = `
                        <div style="color:#c0392b;"><strong>⚠️ 批改與修正：</strong>句子有點太短，無法完整表達情境。<br><em>建議修正：建議加入發生這件事的原因或結果，例如：因為...所以${data.name}。</em></div>
                        <div style="color:#e67e22; margin-top:10px; font-size:1.4rem;"><strong>🏆 評分： ${score} / 5 分</strong></div>
                        <div style="color:#27ae60; margin-top:10px;"><strong>💡 給你的鼓勵：</strong>成語就像調味料，要加在豐富的食材（情境）裡才美味喔！下次試試看多寫一點！</div>
                    `;
                } else {
                    score = 5;
                    fbHTML = `
                        <div style="color:#2c3e50;"><strong>✨ 批改與修正：</strong>句子非常通順，情境也很完整，無需修正！</div>
                        <div style="color:#e67e22; margin-top:10px; font-size:1.4rem;"><strong>🏆 評分： ${score} / 5 分</strong></div>
                        <div style="color:#27ae60; margin-top:10px;"><strong>💡 給你的鼓勵：</strong>太厲害了！你對這個成語的掌握度非常高，繼續保持這個語感！</div>
                    `;
                }
            }

            sessionTotalScore += score;
            feedbackBox.innerHTML = fbHTML;
            feedbackBox.style.display = "block";
            
            let nextBtn = document.getElementById('next-train-btn');
            if(currentTrainIdx === trainingData.length - 1) {
                nextBtn.innerText = "完成特訓！查看總成績 🏆";
                nextBtn.style.background = "#e67e22";
            }
            nextBtn.style.display = "block";
        }

        function nextTraining() {
            currentTrainIdx++;
            if(currentTrainIdx < trainingData.length) {
                loadTrainingUI();
                window.scrollTo(0,0);
            } else {
                finishTraining();
            }
        }

        function finishTraining() {
            saveUserData();
            document.getElementById('final-score-display').innerText = `${sessionTotalScore} / 30 分`;
            
            let encMsg = "";
            if(sessionTotalScore >= 25) encMsg = `太棒了，${currentUser}！你簡直是成語大師，繼續保持優秀的學習熱情！`;
            else if(sessionTotalScore >= 15) encMsg = `做得很不錯喔，${currentUser}！只要多加練習，一定能把成語用得更生動自然！`;
            else encMsg = `不要氣餒，${currentUser}！語言學習本來就需要時間累積，再多看幾次例句，下次一定會更好！`;
            
            document.getElementById('final-encouragement').innerText = encMsg;
            switchTab('result-section');
        }

        // --- 語法查詢器 ---
        function analyzeSyntax() {
            const text = document.getElementById('syntax-input').value;
            const resBox = document.getElementById('query-result');
            
            let foundIdiom = trainingData.find(i => text.includes(i.name));
            
            if(!foundIdiom) { 
                resBox.innerHTML = "<span style='color:#e74c3c'>未偵測到指定的成語喔！請檢查句子。</span>"; 
                return; 
            }
            
            let idiomName = foundIdiom.name;
            let role = "未知";
            if (text.includes(idiomName + "的")) role = "[定語] (修飾名詞)";
            else if (text.includes(idiomName + "地")) role = "[狀語] (修飾動詞)";
            else if (text.endsWith(idiomName) || text.endsWith(idiomName+"。") || text.includes("是" + idiomName)) role = "[謂語] 或 [賓語]";
            else if (text.includes("得" + idiomName)) role = "[補語] (補充狀態)";
            else if (text.startsWith(idiomName)) role = "[主語]";
            else role = "[謂語] (作核心動態描述)";

            resBox.innerHTML = `✅ 目標成語：<span style="color:#8e44ad; font-size:1.4rem;">${idiomName}</span><br>📌 語法角色推測：<span style="color:#d35400; font-size:1.4rem;">${role}</span>`;
        }

        // --- 模態框與排行榜邏輯 ---
        function openLeaderboard() {
            let db = JSON.parse(localStorage.getItem('idiomAppDB')) || {};
            let usersArray = [];
            for(let user in db) { usersArray.push({name: user, score: db[user].score}); }
            usersArray.sort((a, b) => b.score - a.score);

            let tbody = document.getElementById('leaderboard-body');
            tbody.innerHTML = "";
            if(usersArray.length === 0) {
                tbody.innerHTML = "<tr><td colspan='3'>目前還沒有排名紀錄喔！</td></tr>";
            } else {
                usersArray.forEach((u, idx) => {
                    let medal = idx === 0 ? "🥇" : (idx === 1 ? "🥈" : (idx === 2 ? "🥉" : idx + 1));
                    tbody.innerHTML += `<tr><td>${medal}</td><td style="font-weight:bold;">${u.name}</td><td style="color:#e67e22; font-weight:bold;">${u.score} 分</td></tr>`;
                });
            }
            document.getElementById('leaderboard-modal').style.display = "flex";
        }

        function closeModal(modalId) {
            document.getElementById(modalId).style.display = "none";
        }

        // --- 後台數據管理 ---
        function initUserStats() {
            let db = JSON.parse(localStorage.getItem('idiomAppDB')) || {};
            if(!db[currentUser]) {
                db[currentUser] = { score: 0 };
                localStorage.setItem('idiomAppDB', JSON.stringify(db));
            }
        }

        function saveUserData() {
            let db = JSON.parse(localStorage.getItem('idiomAppDB'));
            db[currentUser].score += sessionTotalScore; 
            localStorage.setItem('idiomAppDB', JSON.stringify(db));
        }

        function showAdminLogin() {
            let pwd = prompt("⚙️ 進入系統後台\n\n請輸入管理者密碼：");
            if(pwd === "@admin123") {
                document.getElementById('login-screen').style.display = 'none';
                document.getElementById('main-app').style.display = 'block';
                document.getElementById('bgm-btn').style.display = 'flex';
                switchTab('admin-panel');
                loadAdminData();
            } else if(pwd !== null) {
                alert("密碼錯誤！");
            }
        }

        function loadAdminData() {
            let db = JSON.parse(localStorage.getItem('idiomAppDB')) || {};
            let tbody = document.getElementById('admin-table-body');
            tbody.innerHTML = "";
            
            for(let user in db) {
                tbody.innerHTML += `<tr>
                    <td style="font-weight:bold;">${user}</td>
                    <td style="color:#2c3e50; font-size:1.2rem; font-weight:bold;">${db[user].score} 分</td>
                </tr>`;
            }
        }

        function clearData() {
            if(confirm("⚠️ 警告！確定要清除所有學習者的分數與資料嗎？此動作無法復原。")) {
                localStorage.removeItem('idiomAppDB');
                loadAdminData();
            }
        }
    </script>
</body>
</html>
