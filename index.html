<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏮簡單學成語✨ | 高級華語特訓</title>
    <style>
        /* 全局與背景設定 */
        body, html { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; height: 100%; overflow-x: hidden; background-color: #f4f4f4;}
        
        .bg-layer {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%; z-index: -1;
            background-image: url('https://i.ibb.co/JjSGd7yK/Gemini-Generated-Image-wnn7e2wnn7e2wnn7.png');
            background-size: cover; background-position: center; filter: brightness(0.9);
        }

        /* 首頁標題 (標楷體、黑黃配色) */
        .main-title {
            font-family: 'BiauKai', '標楷體', 'DFKai-SB', serif;
            font-size: 4.5rem; font-weight: bold; color: #f1c40f; text-align: center; margin-bottom: 20px;
            text-shadow: 
                -2px -2px 0 #000, 2px -2px 0 #000, -2px 2px 0 #000, 2px 2px 0 #000,
                4px 4px 0 #000, 6px 6px 15px rgba(0,0,0,0.6);
            letter-spacing: 4px; z-index: 10;
        }

        /* 登入介面 */
        #login-screen { height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; }
        .login-box { background: rgba(255, 255, 255, 0.95); padding: 40px; border-radius: 15px; text-align: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); width: 350px; border-top: 8px solid #f1c40f;}
        .login-box input { padding: 12px; font-size: 1.2rem; border: 2px solid #bdc3c7; border-radius: 8px; margin-bottom: 20px; width: 80%; text-align: center;}
        .login-box button { background: #3498db; color: white; border: none; padding: 12px; font-size: 1.2rem; border-radius: 8px; cursor: pointer; width: 85%; font-weight: bold; margin-bottom: 10px; transition: 0.2s;}
        .login-box button:hover { background: #2980b9; transform: translateY(-2px);}
        .leaderboard-btn { background: #e67e22 !important; }
        .leaderboard-btn:hover { background: #d35400 !important; }

        /* 音樂與設定按鈕 */
        .music-btn, .settings-btn { 
            position: fixed; font-size: 2.2rem; cursor: pointer; z-index: 100; 
            background: #fff; border-radius: 50%; width: 65px; height: 65px; display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); border: 4px solid #bdc3c7; transition: all 0.3s;
        }
        .music-btn { top: 20px; right: 20px; }
        .settings-btn { bottom: 20px; right: 20px; width: 50px; height: 50px; font-size: 1.8rem; border: none; }
        .music-btn.playing { border-color: #f1c40f; color: #e74c3c; animation: pulse-ring 2s infinite, spin-slow 8s linear infinite; }
        .settings-btn:hover { background: #f1c40f; transform: rotate(90deg); }

        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(241, 196, 15, 0); } 100% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0); } }
        @keyframes spin-slow { 100% { transform: rotate(360deg); } }

        /* 內容容器 */
        #main-app { display: none; min-height: 100vh; padding: 20px; box-sizing: border-box; background: rgba(255, 255, 255, 0.7); }
        .section { display: none; max-width: 900px; margin: 0 auto; background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 15px; box-shadow: 0 5px 20px rgba(0,0,0,0.2); }
        .section.active { display: block; }

        /* 主目錄按鈕 */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; }
        .idiom-card-btn { background: #34495e; color: #f1c40f; padding: 20px; text-align: center; border-radius: 10px; cursor: pointer; font-size: 1.8rem; font-family: '標楷體', serif; font-weight: bold; transition: transform 0.2s, background 0.3s; border: 2px solid #2c3e50;}
        .idiom-card-btn:hover { transform: translateY(-5px); background: #2c3e50; color: #fff;}

        /* 圖片故事詞典 (改良版) */
        .idiom-detail-header { text-align: center; margin-bottom: 30px; border-bottom: 2px dashed #bdc3c7; padding-bottom: 20px;}
        .idiom-detail-header img { display: block; margin: 0 auto 20px auto; border-radius: 10px; max-width: 80%; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .data-row { display: flex; padding: 12px 0; border-bottom: 1px solid #eee; text-align: left; align-items: center;}
        .data-label { width: 100px; font-weight: bold; color: #fff; background: #8e44ad; text-align: center; padding: 6px; border-radius: 5px; margin-right: 15px; flex-shrink: 0;}
        .data-content { flex: 1; font-size: 1.15rem; color: #333;}
        
        .reveal-btn { background: #e74c3c; color: white; border: none; padding: 8px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.3s;}
        .reveal-btn:hover { background: #c0392b; }
        .hidden-meta { display: none; background: #fdedec; border-left: 5px solid #e74c3c; padding: 10px; border-radius: 4px; color: #c0392b; font-weight: bold; margin-top: 10px;}

        /* 結構拼裝訓練區 (新增) */
        .builder-area { background: #fff3e0; padding: 20px; border-radius: 10px; margin-top: 20px; border-left: 8px solid #f39c12; text-align: center;}
        .word-bank { display: flex; justify-content: center; gap: 10px; margin-bottom: 15px; flex-wrap: wrap;}
        .char-chip { background: #34495e; color: white; padding: 10px 20px; font-size: 1.5rem; border-radius: 8px; cursor: pointer; font-family: '標楷體', serif; transition: 0.2s;}
        .char-chip:hover { background: #f39c12; transform: scale(1.1);}
        .build-slot { display: inline-block; width: 50px; height: 50px; border: 2px dashed #e67e22; border-radius: 8px; vertical-align: middle; line-height: 50px; font-size: 1.5rem; font-weight: bold; background: white; color: #d35400; cursor: pointer;}
        .build-pattern { font-size: 1.8rem; font-weight: bold; color: #2c3e50; margin: 20px 0;}

        /* 情境測驗區塊 */
        .quiz-area { background: #ecf0f1; padding: 25px; border-radius: 10px; margin-top: 30px; border-left: 8px solid #27ae60;}
        .quiz-status { font-weight: bold; color: #7f8c8d; margin-bottom: 15px; font-size: 1.1rem; display: flex; justify-content: space-between;}
        .quiz-question { margin-bottom: 20px; font-size: 1.25rem; font-weight: bold; color: #2c3e50; line-height: 1.6;}
        .quiz-options button { display: block; width: 100%; text-align: left; padding: 12px; margin: 8px 0; font-size: 1.1rem; border: 2px solid #bdc3c7; background: #fff; border-radius: 8px; cursor: pointer; transition: 0.2s;}
        .quiz-options button:hover { background: #d6eaf8; border-color: #3498db; }
        .quiz-feedback { margin-top: 15px; font-size: 1.1rem; font-weight: bold; display: none; padding: 15px; border-radius: 8px;}
        .feedback-error { background: #fadbd8; color: #c0392b; border: 1px solid #e74c3c; }
        .back-btn { background: #95a5a6; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1rem; margin-bottom: 20px;}

        /* 模態框 (Modal) & 表格 */
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;}
        .modal-content { background: #fff; padding: 30px; border-radius: 15px; width: 100%; max-width: 700px; max-height: 85vh; overflow-y: auto; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 2rem; cursor: pointer; color: #7f8c8d; }
        .close-modal:hover { color: #e74c3c; }
        
        .corpus-list { list-style: none; padding: 0; }
        .corpus-list li { background: #f8f9fa; padding: 15px; margin-bottom: 10px; border-left: 5px solid #3498db; border-radius: 4px; font-size: 1.1rem; line-height: 1.5; color: #2c3e50;}
        .corpus-highlight { color: #e74c3c; font-weight: bold; font-size: 1.2rem; }

        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .admin-table th, .admin-table td { border: 1px solid #bdc3c7; padding: 12px; text-align: center; }
        .admin-table th { background: #34495e; color: white; }
    </style>
</head>
<body>

    <div class="bg-layer"></div>

    <audio id="bgm" loop preload="auto">
        <source src="https://otologic.jp/sounds/bgm/pre/kuuhaku%20to%20seizyaku.mp3" type="audio/mpeg">
    </audio>

    <div id="bgm-btn" class="music-btn" onclick="toggleBGM()" title="開啟/關閉音樂">🎵</div>
    <div class="settings-btn" onclick="showAdminLogin()" title="系統後台">⚙️</div>

    <div id="login-screen">
        <div class="main-title">🏮簡單學成語✨</div>
        <div class="login-box">
            <h3 style="color:#2c3e50; margin-top:0;">TOCFL 高級華語特訓</h3>
            <input type="text" id="username" placeholder="請輸入您的姓名..." autocomplete="off">
            <button onclick="startGame()">▶ 開始學習</button>
            <button class="leaderboard-btn" onclick="openLeaderboard()">🏆 學習排名榜</button>
        </div>
    </div>

    <div id="main-app">
        <div id="dashboard" class="section active">
            <div class="main-title" style="font-size: 3.5rem;">🏮簡單學成語✨</div>
            <h2 style="text-align:center; color:#2c3e50; margin-bottom: 30px;">「有 X 無 Y」固定結構匯集</h2>
            <div class="dashboard-grid" id="dashboard-grid"></div>
            
            <div style="margin-top: 50px; padding: 25px; background: #e8f8f5; border-radius: 15px; border: 2px solid #1abc9c;">
                <h3 style="margin-top:0; color:#16a085;">🔍 語料庫與語法分析器</h3>
                <input type="text" id="syntax-input" placeholder="請輸入包含目標成語的句子..." style="width:75%; padding:12px; font-size:1.1rem; border-radius:5px; border:1px solid #ccc;">
                <button onclick="analyzeSyntax()" style="padding:12px 25px; font-size:1.1rem; background:#1abc9c; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">分析</button>
                <div id="query-result" style="margin-top:15px; font-weight:bold; color:#2c3e50; font-size:1.2rem; line-height: 1.6;"></div>
                <div id="corpus-btn-container" style="margin-top: 15px; display:none;">
                    <button onclick="openCorpusModal()" style="background:#8e44ad; color:white; padding:10px 20px; border:none; border-radius:5px; cursor:pointer; font-size:1.1rem;">📚 查看真實文本範例</button>
                </div>
            </div>
        </div>

        <div id="idiom-detail" class="section">
            <button class="back-btn" onclick="switchTab('dashboard')">⬅ 返回主目錄</button>
            
            <div class="idiom-detail-header" id="detail-header"></div>

            <div class="builder-area" id="builder-area">
                <h3 style="margin-top:0; color:#d35400;">🧩 防生造詞：結構拼裝訓練</h3>
                <p style="color:#7f8c8d; margin-bottom:10px;">請從下方字庫中，點擊正確的字填入空格，完成這個成語！</p>
                <div class="word-bank" id="word-bank"></div>
                <div class="build-pattern">
                    有 <span class="build-slot" id="slot-x" onclick="clearSlot('x')"></span> 
                    無 <span class="build-slot" id="slot-y" onclick="clearSlot('y')"></span>
                </div>
                <button onclick="checkBuild()" style="background:#f39c12; color:white; border:none; padding:10px 20px; font-size:1.2rem; border-radius:5px; cursor:pointer; font-weight:bold;">✅ 驗證結構</button>
                <div id="build-feedback" style="margin-top:10px; font-weight:bold; font-size:1.2rem;"></div>
            </div>

            <div class="quiz-area">
                <h2>📝 情境實戰演練 (隨機 10 題)</h2>
                <div id="quiz-container"></div>
            </div>
        </div>

        <div id="admin-panel" class="section">
            <h2>⚙️ 學習者數據後台</h2>
            <button class="back-btn" onclick="switchTab('dashboard')">返回主目錄</button>
            <button onclick="clearData()" style="background: red; color: white; padding:10px; border:none; border-radius:5px; cursor:pointer; float:right;">清除所有資料</button>
            <table class="admin-table">
                <thead><tr><th>學習者名稱</th><th>總分數</th><th>最擅長成語</th><th>最弱成語</th></tr></thead>
                <tbody id="admin-table-body"></tbody>
            </table>
        </div>
    </div>

    <div id="leaderboard-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('leaderboard-modal')">&times;</span>
            <h2 style="text-align:center; color:#e67e22;">🏆 學習排名榜</h2>
            <table class="admin-table">
                <thead><tr><th>排名</th><th>學習者</th><th>累計總分</th></tr></thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>
    </div>

    <div id="corpus-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('corpus-modal')">&times;</span>
            <h2 style="color:#8e44ad; margin-top:0;" id="corpus-title">語料庫真實範例</h2>
            <p style="color:#7f8c8d; margin-bottom:20px;">觀察真實語境，學習如何正確應用：</p>
            <ul class="corpus-list" id="corpus-list-container"></ul>
        </div>
    </div>

    <script>
        // --- 安全工具：防止 XSS 攻擊 ---
        function escapeHTML(str) {
            return str.replace(/[&<>'"]/g, tag => ({
                '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
            }[tag] || tag));
        }

        // --- 核心資料區 ---
        let currentUser = "";
        let bgmPlaying = false;
        let currentQueriedIdiom = "";

        const idiomsData = {
            "有備無患": { zhuyin: "ㄧㄡˇ ㄅㄟˋ ㄨˊ ㄏㄨㄢˋ", pinyin: "yǒu bèi wú huàn", literal: "只要有準備，就不會有後患。", meta: "比喻事先做好準備，就能避免災禍。", img: "https://i.ibb.co/kVyRBfWJ/image.png", x: "備", y: "患" },
            "有恃無恐": { zhuyin: "ㄧㄡˇ ㄕˋ ㄨˊ ㄎㄨㄥˇ", pinyin: "yǒu shì wú kǒng", literal: "有依靠而沒有恐懼。", meta: "形容有依靠而無所顧忌。", img: "https://i.ibb.co/rKNPVsN9/image.png", x: "恃", y: "恐" },
            "有教無類": { zhuyin: "ㄧㄡˇ ㄐㄧㄠˋ ㄨˊ ㄌㄟˋ", pinyin: "yǒu jiào wú lèi", literal: "教育不分對象的類別。", meta: "指施教的對象沒有貧富、貴賤、智愚、善惡之分。", img: "https://i.ibb.co/qFWVFTLp/image.png", x: "教", y: "類" },
            "有氣無力": { zhuyin: "ㄧㄡˇ ㄑㄧˋ ㄨˊ ㄌㄧˋ", pinyin: "yǒu qì wú lì", literal: "有呼吸但沒有力氣。", meta: "形容精神不振，虛弱無力的樣子。", img: "https://i.ibb.co/TxCKwgR4/image.png", x: "氣", y: "力" },
            "有意無意": { zhuyin: "ㄧㄡˇ ㄧˋ ㄨˊ ㄧˋ", pinyin: "yǒu yì wú yì", literal: "又像是有意，又像是無意。", meta: "形容不是特意，或存心不讓人明顯看出來的樣子。", img: "https://i.ibb.co/N61GDv9f/image.png", x: "意", y: "意" },
            "有眼無珠": { zhuyin: "ㄧㄡˇ ㄧㄢˇ ㄨˊ ㄓㄨ", pinyin: "yǒu yǎn wú zhū", literal: "長了眼睛卻沒有眼珠。", meta: "比喻沒有眼力，看不出人或事物的價值。", img: "https://i.ibb.co/BKZhjrVJ/image.png", x: "眼", y: "珠" }
        };

        // 為縮短篇幅，保留部分測驗與語料作為範例 (原題庫請自行完整貼回)
        const miniCorpus = {
            "有備無患": ["平時儲備好防災物資，遇到突發狀況時才能有備無患。"],
            "有恃無恐": ["歹徒自以為握有人質，有恃無恐地向警方提出各種無理的要求。"],
            "有教無類": ["孔子提倡有教無類，無論學生的身分貴賤，他都願意悉心教導。"],
            "有氣無力": ["經歷了一場大病，他看起來面色蒼白，說話也有氣無力。"],
            "有意無意": ["開會時，主管有意無意地看著他，似乎在暗示他該為這個專案的失敗負責。"],
            "有眼無珠": ["這麼珍貴的宋代青瓷你居然當成普通的碗，真是太有眼無珠了！"]
        };

        const questionBank = {
            "有備無患": [{ q: "林伯伯在周末特地去超市買了幾箱礦泉水防颱。「遇到天災，總是____嘛！」", options: ["有恃無恐", "有意無意", "有備無患", "有眼無珠"], ans: "有備無患", exp: "事先準備物資以防萬一，符合「有備無患」。" }],
            "有恃無恐": [{ q: "他因為背後有強大的財團撐腰，所以在談判桌上總是顯得____。", options: ["有恃無恐", "有氣無力", "有眼無珠", "有備無患"], ans: "有恃無恐", exp: "有靠山而毫無顧忌。" }],
            "有教無類": [{ q: "王校長深信只要給予機會，每個孩子都能成才。他這種「____」的教育理念，改變了無數孩童的命運。", options: ["有恃無恐", "有教無類", "有備無患", "有意無意"], ans: "有教無類", exp: "不分貧富弱勢，平等地給予教育機會。" }],
            "有氣無力": [{ q: "小狗生病打完點滴回來後，整隻狗軟趴趴的，連尾巴都搖得____的。", options: ["有教無類", "有氣無力", "有備無患", "有意無意"], ans: "有氣無力", exp: "生病導致身體虛弱，沒有力氣。" }],
            "有意無意": [{ q: "在討論年底升遷時，總經理____地提到了小李最近談成的大訂單，暗示要提拔他。", options: ["有備無患", "有意無意", "有教無類", "有氣無力"], ans: "有意無意", exp: "不直接說明，透過看似隨口的提及來傳達暗示。" }],
            "有眼無珠": [{ q: "拍賣會上，眾多富商嫌棄的破舊瓷碗竟是宋代汝窯！富商們直呼自己真是____。", options: ["有教無類", "有意無意", "有備無患", "有眼無珠"], ans: "有眼無珠", exp: "看不出古董的真實價值。" }]
        };

        // --- 介面控制與音樂邏輯 ---
        function startGame() {
            const nameInput = document.getElementById('username').value.trim();
            if(!nameInput) { alert("請先輸入您的姓名！"); return; }
            currentUser = escapeHTML(nameInput); // 儲存時就過濾 XSS
            
            const audio = document.getElementById('bgm');
            audio.volume = 0.5;
            let playPromise = audio.play();
            if (playPromise !== undefined) {
                playPromise.then(() => { bgmPlaying = true; document.getElementById('bgm-btn').classList.add('playing'); }).catch(e => console.log("等待手動開啟音樂"));
            }

            document.getElementById('login-screen').style.display = 'none';
            document.getElementById('main-app').style.display = 'block';
            initUserStats(); renderDashboard();
        }

        function toggleBGM() {
            const audio = document.getElementById('bgm');
            const btn = document.getElementById('bgm-btn');
            if(bgmPlaying) { audio.pause(); btn.classList.remove('playing'); } 
            else { audio.play(); btn.classList.add('playing'); }
            bgmPlaying = !bgmPlaying;
        }

        function switchTab(tabId) {
            document.querySelectorAll('.section').forEach(el => el.classList.remove('active'));
            document.getElementById(tabId).classList.add('active');
            window.scrollTo(0,0);
        }

        function renderDashboard() {
            const grid = document.getElementById('dashboard-grid');
            grid.innerHTML = ""; let counter = 1;
            for(let key in idiomsData) {
                grid.innerHTML += `<div class="idiom-card-btn" onclick="openIdiom('${key}')">${counter}. ${key}</div>`;
                counter++;
            }
        }

        // --- 詳情頁、反差記憶與拼裝機 ---
        let currentActiveIdiom = "";
        
        function openIdiom(idiomName) {
            currentActiveIdiom = idiomName;
            const data = idiomsData[idiomName];
            
            // 實作：延遲顯示隱喻義，創造認知反差
            document.getElementById('detail-header').innerHTML = `
                <img src="${data.img}" alt="${idiomName}">
                <div style="max-width: 600px; margin: 0 auto;">
                    <div class="data-row"><div class="data-label">成 語</div><div class="data-content" style="font-weight:bold; font-size:1.8rem; color:#8e44ad;">${idiomName}</div></div>
                    <div class="data-row"><div class="data-label">拼 音</div><div class="data-content">${data.zhuyin} (${data.pinyin})</div></div>
                    <div class="data-row"><div class="data-label" style="background:#3498db;">字面義</div><div class="data-content">${data.literal}</div></div>
                    <div class="data-row" style="border:none;">
                        <button class="reveal-btn" onclick="document.getElementById('meta-box').style.display='block'; this.style.display='none';">💡 點擊解鎖實際含義 (隱喻義)</button>
                        <div id="meta-box" class="hidden-meta">🔍 實際含義：${data.meta}</div>
                    </div>
                </div>
            `;
            
            initBuilder(data);
            
            document.getElementById('quiz-container').innerHTML = `
                <p style="font-size:1.1rem; color:#34495e; background:#fff; padding:15px; border-radius:8px;">⚠️ **計分規則**：每題有 3 次作答機會。答對得 10 分，錯 3 次該題 0 分並顯示詳解。</p>
                <button onclick="startQuiz()" style="padding:12px 30px; font-size:1.2rem; background:#27ae60; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; margin-top:10px;">▶ 開始測驗</button>
            `;
            switchTab('idiom-detail');
        }

        // --- 拼裝遊戲邏輯 (防止生造詞) ---
        let slotX = "", slotY = "";
        function initBuilder(data) {
            slotX = ""; slotY = "";
            document.getElementById('slot-x').innerText = "";
            document.getElementById('slot-y').innerText = "";
            document.getElementById('build-feedback').innerText = "";
            
            // 混淆字庫 (正確字 + 隨機干擾字)
            let chars = [data.x, data.y, "險", "心", "理", "名", "目"];
            chars = [...new Set(chars)].sort(() => 0.5 - Math.random()).slice(0, 6); // 取6個不重複字
            
            let bankHtml = "";
            chars.forEach(c => {
                bankHtml += `<span class="char-chip" onclick="fillSlot('${c}')">${c}</span>`;
            });
            document.getElementById('word-bank').innerHTML = bankHtml;
        }

        function fillSlot(char) {
            if(!slotX) { slotX = char; document.getElementById('slot-x').innerText = char; }
            else if(!slotY) { slotY = char; document.getElementById('slot-y').innerText = char; }
        }

        function clearSlot(type) {
            if(type === 'x') { slotX = ""; document.getElementById('slot-x').innerText = ""; }
            if(type === 'y') { slotY = ""; document.getElementById('slot-y').innerText = ""; }
        }

        function checkBuild() {
            const data = idiomsData[currentActiveIdiom];
            const feedback = document.getElementById('build-feedback');
            if(!slotX || !slotY) { feedback.innerHTML = "<span style='color:#e74c3c;'>請先填滿兩個空格喔！</span>"; return; }
            
            if(slotX === data.x && slotY === data.y) {
                feedback.innerHTML = "<span style='color:#27ae60;'>🎉 結構正確！這就是「" + currentActiveIdiom + "」。</span>";
            } else {
                feedback.innerHTML = "<span style='color:#c0392b;'>❌ 結構錯誤！中文裡沒有「有" + slotX + "無" + slotY + "」這種說法喔，請重新嘗試！</span>";
                clearSlot('x'); clearSlot('y');
            }
        }

        // --- 測驗系統狀態 ---
        let currentQuizList = [], currentQIdx = 0, currentQAttempts = 0, sessionScore = 0;

        function startQuiz() {
            let pool = [...questionBank[currentActiveIdiom]];
            currentQuizList = pool.sort(() => 0.5 - Math.random()).slice(0, 10);
            currentQIdx = 0; sessionScore = 0;
            showQuestion();
        }

        function showQuestion() {
            if(currentQIdx >= currentQuizList.length) { endQuiz(); return; }
            currentQAttempts = 0;
            const qData = currentQuizList[currentQIdx];
            
            let opts = [...qData.options].sort(() => 0.5 - Math.random());
            let optionsHtml = "";
            opts.forEach(opt => { optionsHtml += `<button onclick="checkAnswer('${opt}', this)">${opt}</button>`; });

            document.getElementById('quiz-container').innerHTML = `
                <div class="quiz-status"><span>📝 題目： ${currentQIdx + 1} / ${currentQuizList.length}</span><span style="color:#e67e22;">⭐ 得分：${sessionScore}</span></div>
                <div class="quiz-question">${qData.q}</div>
                <div class="quiz-options" id="options-box">${optionsHtml}</div>
                <div id="q-feedback" class="quiz-feedback"></div>
                <button id="next-btn" onclick="nextQuestion()" style="display:none; margin-top:20px; padding:12px 25px; background:#3498db; color:white; border:none; border-radius:5px; cursor:pointer; width:100%; font-weight:bold;">下一題 ➡</button>
            `;
        }

        function checkAnswer(selected, btnElement) {
            const qData = currentQuizList[currentQIdx];
            const feedbackBox = document.getElementById('q-feedback');
            
            if(selected === qData.ans) {
                btnElement.style.background = "#2ecc71"; btnElement.style.color = "white";
                feedbackBox.className = "quiz-feedback"; feedbackBox.style.background = "#d5f5e3"; feedbackBox.style.color = "#27ae60";
                feedbackBox.innerHTML = `✅ 答對了！得 10 分。<br><span style="font-size:1rem; font-weight:normal; display:block; margin-top:8px;">💡 解析：${qData.exp}</span>`;
                feedbackBox.style.display = "block"; sessionScore += 10; recordStat(currentActiveIdiom, true); lockOptions();
            } else {
                currentQAttempts++;
                btnElement.style.background = "#e74c3c"; btnElement.style.color = "white"; btnElement.disabled = true;
                if(currentQAttempts >= 3) {
                    feedbackBox.className = "quiz-feedback feedback-error";
                    feedbackBox.innerHTML = `❌ 錯誤已達 3 次！本題 0 分。<br>正確答案是：<strong>${qData.ans}</strong><br><span style="font-size:1rem; font-weight:normal; display:block; margin-top:8px;">💡 語境解析：這不是正確的固定搭配，${qData.exp}</span>`;
                    feedbackBox.style.display = "block"; recordStat(currentActiveIdiom, false); lockOptions();
                } else {
                    feedbackBox.className = "quiz-feedback feedback-error";
                    feedbackBox.innerHTML = `❌ 答錯了！還剩 ${3 - currentQAttempts} 次機會。請再想想語境與意思。`;
                    feedbackBox.style.display = "block";
                }
            }
        }

        function lockOptions() { document.getElementById('options-box').querySelectorAll('button').forEach(b => b.disabled = true); document.getElementById('next-btn').style.display = "block"; }
        function nextQuestion() { currentQIdx++; showQuestion(); }
        function endQuiz() { saveUserData(); document.getElementById('quiz-container').innerHTML = `<h2 style="text-align:center;">🎉 測驗結束！總得分：${sessionScore} 分</h2>`; }

        // --- 分析器與 Modals 邏輯保留原樣 (節省篇幅) ---
        function analyzeSyntax() { /* ...同原程式碼... */ }
        function openLeaderboard() { /* ...同原程式碼... */ }
        function openCorpusModal() { /* ...同原程式碼... */ }
        function closeModal(modalId) { document.getElementById(modalId).style.display = "none"; }
        
        // --- 後台數據管理 ---
        function initUserStats() {
            let db = JSON.parse(localStorage.getItem('idiomAppDB')) || {};
            if(!db[currentUser]) {
                db[currentUser] = { score: 0, stats: {} };
                for(let key in idiomsData) db[currentUser].stats[key] = { correct: 0, wrong: 0 };
                localStorage.setItem('idiomAppDB', JSON.stringify(db));
            }
        }

        function recordStat(idiom, isCorrect) {
            let db = JSON.parse(localStorage.getItem('idiomAppDB'));
            if(isCorrect) db[currentUser].stats[idiom].correct++; else db[currentUser].stats[idiom].wrong++;
            localStorage.setItem('idiomAppDB', JSON.stringify(db));
        }

        function saveUserData() {
            let db = JSON.parse(localStorage.getItem('idiomAppDB'));
            db[currentUser].score += sessionScore; localStorage.setItem('idiomAppDB', JSON.stringify(db));
        }

        function showAdminLogin() {
            let pwd = prompt("⚙️ 進入系統後台\n請輸入管理者密碼 (預設: @admin123)：");
            if(pwd === "@admin123") {
                document.getElementById('login-screen').style.display = 'none'; document.getElementById('main-app').style.display = 'block';
                switchTab('admin-panel'); loadAdminData();
            } else if(pwd !== null) { alert("密碼錯誤！"); }
        }

        function loadAdminData() {
            let db = JSON.parse(localStorage.getItem('idiomAppDB')) || {};
            let tbody = document.getElementById('admin-table-body'); tbody.innerHTML = "";
            for(let user in db) {
                let uData = db[user]; let maxC = -1, best = "無", maxW = -1, worst = "無";
                for(let idiom in uData.stats) {
                    if(uData.stats[idiom].correct > maxC && uData.stats[idiom].correct > 0) { maxC = uData.stats[idiom].correct; best = idiom; }
                    if(uData.stats[idiom].wrong > maxW && uData.stats[idiom].wrong > 0) { maxW = uData.stats[idiom].wrong; worst = idiom; }
                }
                // 在後台顯示時，確保使用 escapeHTML 的乾淨資料 (不過我們在登入時已經過濾過了，這裡是雙重保險)
                tbody.innerHTML += `<tr><td style="font-weight:bold;">${escapeHTML(user)}</td><td>${uData.score}</td><td style="color:#27ae60;">${best}</td><td style="color:#c0392b;">${worst}</td></tr>`;
            }
        }

        function clearData() {
            if(confirm("⚠️ 警告！確定清除所有資料嗎？")) { localStorage.removeItem('idiomAppDB'); loadAdminData(); }
        }
    </script>
</body>
</html>
