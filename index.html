<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>🏮簡單學成語✨</title>
    <style>
        /* 全局與背景設定 */
        body, html { 
            margin: 0; 
            padding: 0; 
            font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; 
            height: 100%; 
            overflow-x: hidden; 
            /* 【修正重點 1】將原本的 #2c3e50 移除，改為透明，避免遮擋背景層 */
            background-color: transparent; 
        }
        
        .bg-layer {
            position: fixed; 
            top: 0; 
            left: 0; 
            width: 100%; 
            height: 100%; 
            z-index: -1;
            /* 【修正重點 2】將備用底色放在這裡 */
            background-color: #2c3e50;
            /* 背景圖網址已嚴格保留不變 */
            background-image: url('https://i.ibb.co/zVJHDDtc/Gemini-Generated-Image-wnn7e2wnn7e2wnn7.png');
            background-size: cover; 
            background-position: center; 
            background-attachment: fixed; 
            filter: brightness(0.9);
        }

        /* 首頁標題 (標楷體、3D立體風格) */
        .main-title {
            font-family: 'Kaiti TC', 'KaiTi', '標楷體', serif;
            font-size: 4.5rem; font-weight: bold; color: #FFD700; text-align: center; margin-bottom: 10px;
            text-shadow: 2px 2px 0px #b8860b, 4px 4px 0px #8b6508, 6px 6px 15px rgba(0,0,0,0.7);
            letter-spacing: 4px; z-index: 10;
        }
        .sub-title { text-align: center; font-size: 1.3rem; color: #f8fafc; margin-bottom: 35px; letter-spacing: 1px; text-shadow: 2px 2px 4px rgba(0,0,0,0.8); font-weight: bold;}

        /* 登入介面 (毛玻璃設計) */
        #login-screen { min-height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; padding: 20px;}
        .login-card {
            background: rgba(30, 41, 59, 0.7); border: 1px solid rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px);
            border-radius: 20px; padding: 40px 30px; width: 100%; max-width: 400px;
            box-shadow: 0 20px 50px rgba(0,0,0,0.6); text-align: center;
        }
        .login-card label { color: #e2e8f0; font-size: 1.1rem; font-weight: bold; margin-bottom: 15px; display: block; }
        .login-card input {
            width: 100%; padding: 14px 15px; margin-bottom: 25px;
            background: rgba(15, 23, 42, 0.7); color: white; border: 1px solid #64748b; border-radius: 10px;
            font-size: 1.1rem; box-sizing: border-box; outline: none; transition: 0.3s; text-align: center;
        }
        .login-card input:focus { border-color: #F6D365; background: rgba(15, 23, 42, 0.9); }
        .login-card input::placeholder { color: #94a3b8; }
        
        .btn-group { display: flex; flex-direction: column; gap: 15px; }
        .btn-start-main { background: linear-gradient(45deg, #FF512F, #DD2476); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(221, 36, 118, 0.5); }
        .btn-start-main:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(221, 36, 118, 0.7); }
        .btn-start-mini { background: linear-gradient(45deg, #f39c12, #d35400); color: white; border: none; padding: 15px; border-radius: 12px; font-size: 1.2rem; font-weight: bold; cursor: pointer; transition: 0.3s; box-shadow: 0 4px 15px rgba(230, 126, 34, 0.5); }
        .btn-start-mini:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(230, 126, 34, 0.7); }

        /* 音樂與設定按鈕 */
        .music-btn, .settings-btn { 
            position: fixed; right: 20px; font-size: 2rem; cursor: pointer; z-index: 100; 
            background: rgba(255,255,255,0.9); border-radius: 50%; width: 60px; height: 60px; display: flex; align-items: center; justify-content: center; 
            box-shadow: 0 4px 10px rgba(0,0,0,0.3); transition: all 0.3s;
        }
        .music-btn { top: 20px; border: 3px solid #bdc3c7; }
        .settings-btn { bottom: 20px; }
        .music-btn.playing { border-color: #f1c40f; color: #e74c3c; animation: pulse-ring 2s infinite, spin-slow 8s linear infinite; }
        .settings-btn:hover { background: #fff; transform: rotate(90deg); }
        
        @keyframes pulse-ring { 0% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(241, 196, 15, 0); } 100% { box-shadow: 0 0 0 0 rgba(241, 196, 15, 0); } }
        @keyframes spin-slow { 100% { transform: rotate(360deg); } }

        /* 內容容器 */
        #main-app { display: none; min-height: 100vh; padding: 20px; box-sizing: border-box; background: rgba(255, 255, 255, 0.85); }
        .section { display: none; max-width: 900px; margin: 0 auto; background: rgba(255, 255, 255, 0.95); padding: 30px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.2); }
        .section.active { display: block; }

        /* 主目錄按鈕 */
        .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 30px;}
        .idiom-card-btn { background: #34495e; color: #f1c40f; padding: 20px; text-align: center; border-radius: 10px; cursor: pointer; font-size: 1.8rem; font-family: '標楷體', serif; font-weight: bold; transition: transform 0.2s, background 0.3s; border: 2px solid #2c3e50; position: relative;}
        .idiom-card-btn:hover { transform: translateY(-5px); background: #2c3e50; color: #fff;}
        .idiom-card-btn.completed { background: #27ae60; color: #fff; border-color: #2ecc71; }
        .idiom-card-btn.completed::after { content: "✅"; position: absolute; top: -10px; right: -10px; font-size: 1.5rem; background: #fff; border-radius: 50%; box-shadow: 0 2px 5px rgba(0,0,0,0.2);}

        .finale-btn { grid-column: 1 / -1; background: #e74c3c; color: white; border: none; padding: 20px; font-size: 1.8rem; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 20px; box-shadow: 0 5px 15px rgba(231,76,60,0.4); transition: 0.3s; opacity: 0.5; pointer-events: none;}
        .finale-btn.unlocked { opacity: 1; pointer-events: auto; animation: unlock-pulse 2s infinite; }
        @keyframes unlock-pulse { 0% { transform: scale(1); } 50% { transform: scale(1.02); } 100% { transform: scale(1); } }

        /* 統一平面資訊表設計 */
        .training-header { text-align: center; margin-bottom: 25px;}
        .training-header img { display: block; margin: 0 auto 20px auto; border-radius: 12px; max-width: 85%; box-shadow: 0 5px 15px rgba(0,0,0,0.2); }
        .training-title { font-size: 3rem; color: #8e44ad; font-family: '標楷體', serif; font-weight: bold; margin-bottom: 20px; }
        
        .info-table { max-width: 750px; margin: 0 auto 30px auto; background: #fff; padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); border: 1px solid #eaeaea;}
        .data-row { display: flex; padding: 12px 0; border-bottom: 1px solid #f0f0f0; text-align: left; align-items: flex-start;}
        .data-row:last-child { border-bottom: none; }
        .data-label { width: 120px; font-weight: bold; color: #fff; background: #8e44ad; text-align: center; padding: 8px; border-radius: 6px; margin-right: 20px; flex-shrink: 0; font-size: 1.1rem; align-self: flex-start;}
        .data-content { flex: 1; font-size: 1.15rem; color: #2c3e50; line-height: 1.6; align-self: center;}
        .en-note { display: block; font-size: 0.95rem; color: #7f8c8d; font-style: italic; margin-top: 4px; }
        
        .corpus-examples { background: #fdfefe; padding: 25px; border-radius: 12px; border: 1px solid #16a085; margin-bottom: 25px; box-shadow: 0 4px 10px rgba(22, 160, 133, 0.1);}
        .corpus-examples h4 { margin-top: 0; color: #16a085; border-bottom: 2px solid #16a085; padding-bottom: 10px; font-size: 1.3rem;}
        .corpus-examples ul { padding-left: 25px; margin: 0; line-height: 1.8; font-size: 1.15rem; color: #2c3e50;}
        .highlight-idiom { color: #e74c3c; font-weight: bold; }

        .corpus-btn { display: inline-block; padding: 10px 20px; background: #2980b9; color: white; text-decoration: none; border-radius: 6px; font-weight: bold; font-size: 1.1rem; transition: 0.2s; box-shadow: 0 3px 6px rgba(41, 128, 185, 0.4);}
        .corpus-btn:hover { background: #2471a3; transform: translateY(-2px); color: white;}

        .writing-area { background: #ecf0f1; padding: 25px; border-radius: 12px; margin-top: 20px; border-left: 6px solid #34495e;}
        .writing-area h3 { margin-top: 0; color: #2c3e50;}
        .writing-area textarea { width: 100%; height: 120px; padding: 15px; font-size: 1.2rem; border-radius: 8px; border: 2px solid #bdc3c7; box-sizing: border-box; resize: vertical;}
        .writing-area button { display: block; width: 100%; background: #27ae60; color: white; border: none; padding: 15px; font-size: 1.3rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 15px; transition: 0.2s; box-shadow: 0 4px 6px rgba(39, 174, 96, 0.4);}
        .writing-area button:hover { background: #2196f3; box-shadow: 0 4px 6px rgba(33, 150, 243, 0.4);}
        
        .feedback-box { display: none; background: #fff; padding: 20px; border-radius: 8px; border-left: 8px solid #f1c40f; margin-top: 20px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); font-size: 1.15rem; line-height: 1.6;}
        
        /* 大測驗區塊 */
        .quiz-area { background: #fff; padding: 25px; border-radius: 10px; border: 2px solid #e74c3c; box-shadow: 0 5px 15px rgba(0,0,0,0.1);}
        .quiz-status { font-weight: bold; color: #7f8c8d; margin-bottom: 15px; font-size: 1.2rem; display: flex; justify-content: space-between;}
        .quiz-question { margin-bottom: 20px; font-size: 1.3rem; font-weight: bold; color: #2c3e50; line-height: 1.6; background: #fdf2e9; padding: 15px; border-radius: 8px;}
        .quiz-options button { display: block; width: 100%; text-align: left; padding: 12px; margin: 8px 0; font-size: 1.2rem; border: 2px solid #bdc3c7; background: #fff; border-radius: 8px; cursor: pointer; transition: 0.2s;}
        .quiz-options button:hover { background: #d6eaf8; border-color: #3498db; }
        
        .next-btn { display: none; width: 100%; background: #9b59b6; color: white; border: none; padding: 15px; font-size: 1.3rem; font-weight: bold; border-radius: 8px; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 6px rgba(155, 89, 182, 0.4);}
        .back-btn { background: #95a5a6; color: white; padding: 10px 20px; border: none; border-radius: 8px; cursor: pointer; font-size: 1.1rem; margin-bottom: 20px;}

        /* 表格與模態框 */
        .admin-table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        .admin-table th, .admin-table td { border: 1px solid #bdc3c7; padding: 12px; text-align: center; background: white;}
        .admin-table th { background: #34495e; color: white; }
        
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; padding: 20px; box-sizing: border-box;}
        .modal-content { background: #fff; padding: 30px; border-radius: 15px; width: 100%; max-width: 600px; position: relative; box-shadow: 0 10px 30px rgba(0,0,0,0.5);}
        .close-modal { position: absolute; top: 15px; right: 20px; font-size: 2rem; cursor: pointer; color: #7f8c8d; }
        .close-modal:hover { color: #e74c3c; }
    </style>
</head>
<body>

    <div class="bg-layer"></div>

    <audio id="bgm" loop preload="auto">
        <source src="https://otologic.jp/sounds/bgm/pre/kuuhaku%20to%20seizyaku.mp3" type="audio/mpeg">
    </audio>

    <div id="bgm-btn" class="music-btn" onclick="toggleBGM()" title="開啟/關閉音樂">🎵</div>
    <div class="settings-btn" onclick="showAdminLogin()" title="系統後台">⚙️</div>

    <div id="login-screen">
        <div class="main-title">簡單學成語</div>
        <div class="sub-title">Learn Idioms Easily</div>
        
        <div class="login-card">
            <label for="username">👤 Your Name / 您的名字：</label>
            <input type="text" id="username" placeholder="Enter your name..." autocomplete="off">
            
            <div class="btn-group">
                <button class="btn-start-main" onclick="startGame()">🚀 開始學習 Start</button>
                <button class="btn-start-mini leaderboard-btn" onclick="openLeaderboard()">🏆 學習排名榜 Leaderboard</button>
            </div>
        </div>
    </div>

    <div id="main-app">
        <div id="dashboard" class="section active">
            <div class="main-title" style="font-size: 4rem; text-shadow: 2px 2px 4px rgba(0,0,0,0.3);">「有X無Y」成語匯集</div>
            <p style="text-align:center; font-size:1.3rem; color:#34495e; font-weight:bold;">請點擊下方成語開始造句特訓，全數完成即可解鎖大挑戰！</p>
            <div class="dashboard-grid" id="dashboard-grid">
                </div>
            
            <button id="grand-finale-btn" class="finale-btn" onclick="startGrandFinale()">🔥 總體大練習 (未解鎖)</button>
            
            <div style="margin-top: 50px; padding: 25px; background: #e8f8f5; border-radius: 15px; border: 2px solid #1abc9c; box-shadow: 0 4px 10px rgba(0,0,0,0.1);">
                <h3 style="margin-top:0; color:#16a085;">🔍 語法分析器 (POS Analyzer)</h3>
                <input type="text" id="syntax-input" placeholder="請輸入包含目標成語的句子..." style="width:75%; padding:12px; font-size:1.1rem; border-radius:5px; border:1px solid #ccc;">
                <button onclick="analyzeSyntax()" style="padding:12px 25px; font-size:1.1rem; background:#1abc9c; color:white; border:none; border-radius:5px; cursor:pointer; font-weight:bold;">分析 Analyze</button>
                <div id="query-result" style="margin-top:15px; font-weight:bold; color:#2c3e50; font-size:1.2rem; line-height: 1.6;"></div>
            </div>
        </div>

        <div id="training-section" class="section">
            <button class="back-btn" onclick="switchTab('dashboard')">⬅ 返回主目錄 (Back)</button>
            <div id="training-content"></div>
        </div>

        <div id="finale-section" class="section">
            <h2 style="text-align:center; color:#e74c3c; font-size: 2.2rem; margin-top:0;">🔥 總體大練習：情境挑戰</h2>
            <div class="quiz-area">
                <div class="quiz-status">
                    <span id="finale-progress">📝 題目： 1 / 10</span>
                    <span id="finale-score-display" style="color:#e67e22;">⭐ 得分：0 分</span>
                </div>
                <div id="finale-question" class="quiz-question"></div>
                <div class="quiz-options" id="finale-options"></div>
                <div id="finale-feedback" class="feedback-box"></div>
                <button id="finale-next-btn" class="next-btn" onclick="nextFinaleQuestion()">下一題 (Next) ➡</button>
            </div>
        </div>

        <div id="result-section" class="section">
            <h2 style="text-align:center; color:#2c3e50; font-size:2.8rem;" id="final-name-title">🎉 恭喜完成所有挑戰！</h2>
            <div style="text-align:center; font-size:1.4rem; color:#7f8c8d; margin-bottom: 20px;">造句特訓 (30分) + 情境大測驗 (70分)</div>
            <div style="text-align:center; font-size:6rem; font-weight:bold; color:#e74c3c; margin:20px 0; text-shadow: 3px 3px 0px #fadbd8;" id="final-score-display">0 / 100</div>
            <div id="final-encouragement" style="text-align:center; font-size:1.5rem; color:#27ae60; font-weight:bold; margin-bottom: 40px; line-height:1.6;"></div>
            <div style="text-align:center;">
                <button onclick="location.reload()" style="padding:15px 40px; font-size:1.3rem; background:#3498db; color:white; border:none; border-radius:8px; cursor:pointer; font-weight:bold; box-shadow: 0 4px 10px rgba(52, 152, 219, 0.4);">🏠 返回首頁 (Home)</button>
            </div>
        </div>

        <div id="admin-panel" class="section">
            <h2 style="margin-top:0;">⚙️ 學習者數據後台</h2>
            <button class="back-btn" onclick="switchTab('dashboard')">返回主目錄</button>
            <button onclick="downloadSentencesAsTxt()" style="background: #27ae60; color: white; padding:10px 20px; border:none; border-radius:5px; cursor:pointer; margin-right: 10px; font-weight:bold; font-size:1.1rem;">📥 下載造句語料庫 (.txt)</button>
            <button onclick="clearData()" style="background: #e74c3c; color: white; padding:10px 15px; border:none; border-radius:5px; cursor:pointer; float:right; font-weight:bold;">🗑️ 清除所有資料</button>
            <table class="admin-table">
                <thead><tr><th>學習者名稱 Name</th><th>總分數 Total Score</th></tr></thead>
                <tbody id="admin-table-body"></tbody>
            </table>
        </div>
    </div>

    <div id="leaderboard-modal" class="modal">
        <div class="modal-content">
            <span class="close-modal" onclick="closeModal('leaderboard-modal')">&times;</span>
            <h2 style="text-align:center; color:#e67e22; margin-top:0;">🏆 學習排名榜 Leaderboard</h2>
            <table class="admin-table">
                <thead><tr><th>排名 Rank</th><th>學習者 Name</th><th>累計總分 Score</th></tr></thead>
                <tbody id="leaderboard-body"></tbody>
            </table>
        </div>
    </div>

    <script>
        // --- 核心資料區 ---
        let currentUser = "";
        let isUserMuted = localStorage.getItem('idiomAppMuted') === 'true';
        let bgmPlaying = false;

        let completedIdioms = [];
        let sentenceScore = 0;
        let finaleScore = 0;

        // 含注音、拼音、字面義、隱喻義及英文輔助說明的教學資料 (精簡至3個例句)

            {

            },
            {
                name: "有恃無恐", img: "https://i.ibb.co/rKNPVsN9/image.png",
                zhuyin: "ㄧㄡˇ ㄕˋ ㄨˊ ㄎㄨㄥˇ", pinyin: "yǒu shì wú kǒng",
                literal: "有依靠而沒有恐懼。", meta: "形容有依靠而無所顧忌。",
                enDef: "To feel secure and act recklessly because one has backing.",
                collocation: "常用於形容仗勢欺人。常接「地 + 動詞」、「顯得～」。", enCollocation: "Used to describe someone acting arrogantly due to strong support.",
                examples: [
                    "那些<span class='highlight-idiom'>有恃無恐</span>的孩子，竟然對著教師挑釁。",
                    "父母親又替他開罪，孩子就<span class='highlight-idiom'>有恃無恐</span>，變本加厲。",
                    "生產者和消費者之間不公平，也是廠商<span class='highlight-idiom'>有恃無恐</span>的主因。"
                ]
            },
            {
                name: "有教無類", img: "https://i.ibb.co/qFWVFTLp/image.png",
                zhuyin: "ㄧㄡˇ ㄐㄧㄠˋ ㄨˊ ㄌㄟˋ", pinyin: "yǒu jiào wú lèi",
                literal: "教育不分對象的類別。", meta: "指施教的對象沒有貧富、貴賤、智愚、善惡之分。",
                enDef: "Education for everyone, irrespective of background.",
                collocation: "形容教育公平。常接「～的精神」、「做到～」。", enCollocation: "Describes equal educational opportunities for all.",
                examples: [
                    "沒有預設立場的教師，才能發揮<span class='highlight-idiom'>有教無類</span>的精神。",
                    "胸懷愛護之心，才能做到<span class='highlight-idiom'>有教無類</span>。",
                    "孔子是萬世師表，<span class='highlight-idiom'>有教無類</span>，每個中國人的生命中都留有孔子。"
                ]
            },
            {
                name: "有氣無力", img: "https://i.ibb.co/TxCKwgR4/image.png",
                zhuyin: "ㄧㄡˇ ㄑㄧˋ ㄨˊ ㄌㄧˋ", pinyin: "yǒu qì wú lì",
                literal: "有呼吸但沒有力氣。", meta: "形容精神不振，虛弱無力的樣子。",
                enDef: "Faint and feeble; lacking energy.",

        function submitSentence() {
            const inputField = document.getElementById('sentence-input');

            if(input === "") { alert("請先輸入句子喔！"); return; }
            
            inputField.disabled = true;

            let score = 0;
            let fbHTML = "";

            if(!input.includes(data.name)) {
                score = 1;
                fbHTML = `
                    <div style="color:#c0392b;"><strong>❌ 批改與修正：</strong>你好像沒有用到「${data.name}」喔！<br><em>建議修正：請嘗試把成語加入句子中。</em></div>

                `;
            } else {
                let isTooSimilar = data.examples.some(ex => {
                    let cleanEx = ex.replace(/[，。！「」\[\]a-zA-Z:0-9\s]/g, "");
                    let cleanIn = input.replace(/[，。！「」\s]/g, "");
                    return cleanEx.includes(cleanIn) || cleanIn.includes(cleanEx);
                });

                if(isTooSimilar && input.length < 20) {
                    score = 3;
                    fbHTML = `

                    `;
                } else {
                    score = 5;
                    fbHTML = `
                        <div style="color:#2c3e50;"><strong>✨ 批改與修正：</strong>句子非常通順，情境也很完整，完美！</div>
                        <div style="color:#e67e22; margin-top:10px; font-size:1.4rem;"><strong>🏆 評分： ${score} / 5 分</strong></div>

        function downloadSentencesAsTxt() {
            let db = JSON.parse(localStorage.getItem('idiomAppDB')) || {};
            let content = "【學習者造句紀錄語料庫 (Learner Corpus)】\n\n";
            let corpusByIdiom = {};

            for(let user in db) {
                if(db[user].sentences) {
                    for(let idiom in db[user].sentences) {
                        if(!corpusByIdiom[idiom]) corpusByIdiom[idiom] = [];
                        db[user].sentences[idiom].forEach(sentence => {
                            corpusByIdiom[idiom].push(`[${user}] ${sentence}`);
                        });
                    }
                }
            }

            let hasData = false;
            for(let idiom in corpusByIdiom) {
                hasData = true;
                content += `====================\n▶ 成語：${idiom}\n====================\n`;
                corpusByIdiom[idiom].forEach(s => { content += s + "\n"; });
                content += "\n";
            }

            if(!hasData) {
                alert("目前還沒有學習者留下造句紀錄喔！");
                return;
            }

            let blob = new Blob([content], { type: "text/plain;charset=utf-8" });
            let url = URL.createObjectURL(blob);
            let a = document.createElement("a");
            a.href = url;
            a.download = "學生造句語料庫.txt";
            a.click();
            URL.revokeObjectURL(url);
        }

        function clearData() {
            if(confirm("⚠️ 警告！確定要清除所有學習者的成績與造句紀錄嗎？此動作無法復原。")) {
                localStorage.removeItem('idiomAppDB');
                document.getElementById('admin-table-body').innerHTML = "";
                alert("資料已全部清除！");
            }
        }

        // --- 語法分析器 ---
        function analyzeSyntax() {
            const text = document.getElementById('syntax-input').value;
            const resBox = document.getElementById('query-result');
            let foundIdiom = trainingData.find(i => text.includes(i.name));
            
            if(!foundIdiom) { 
                resBox.innerHTML = "<span style='color:#e74c3c'>未偵測到指定的成語喔！請檢查句子。</span>"; 
                return; 
            }
            
            let idiomName = foundIdiom.name;
            let role = "未知";
            if (text.includes(idiomName + "的")) role = "[定語] (修飾名詞)";
            else if (text.includes(idiomName + "地")) role = "[狀語] (修飾動詞)";
            else if (text.endsWith(idiomName) || text.endsWith(idiomName+"。") || text.includes("是" + idiomName)) role = "[謂語] 或 [賓語]";
            else if (text.includes("得" + idiomName)) role = "[補語] (補充狀態)";
            else if (text.startsWith(idiomName)) role = "[主語]";
            else role = "[謂語] (作核心動態描述)";

            resBox.innerHTML = `✅ 目標成語：<span style="color:#8e44ad; font-size:1.4rem;">${idiomName}</span><br>📌 語法角色推測：<span style="color:#d35400; font-size:1.4rem;">${role}</span>`;
        }
    </script>
</body>
</html>
